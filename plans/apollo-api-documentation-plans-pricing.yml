specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Apollo API Documentation
providerId: apollo-api-documentation
generated: '2026-08-14'
method: probed
source: >-
  https://www.apollo.io/pricing — schema.org OfferCatalog JSON-LD embedded in the page, plus
  https://docs.apollo.io/docs/api-pricing (credit model) and https://docs.apollo.io/reference/rate-limits
  (per-tier limits)
created: '2026-05-04'
modified: '2026-08-14'
tags:
  - Pricing
  - Plans
  - Credits
description: >-
  Apollo's published plans, replacing the 2026-05-04 scaffold that carried invented prices and quotas. Prices
  and tier names are read from the machine-readable schema.org OfferCatalog Apollo embeds in
  https://www.apollo.io/pricing; per-tier API rate limits come from the rate-limits reference; the credit
  model comes from the API pricing reference. Apollo does NOT sell API access as a separate product — API
  access rides on the platform plan, and consumption is metered in CREDITS rather than in API calls. The
  human-readable pricing table itself is JS-rendered, so seat counts, included credit allowances and annual
  discounts are not recorded here; the JSON-LD is the only machine-readable pricing Apollo serves.
plan_count: 4
billing_model: seat-plus-credits
currency: USD
plans:
  - id: apollo-free
    name: Free
    type: freemium
    price: '0'
    currency: USD
    period: month
    description: >-
      Basic access to sales engagement tools and a limited contact database (Apollo's own JSON-LD wording).
    api_access: true
    limits:
      - {metric: requests_per_minute, limit: 50, scope: per-team-per-endpoint}
      - {metric: requests_per_hour, limit: 200, scope: per-team-per-endpoint}
      - {metric: requests_per_day, limit: 600, scope: per-team-per-endpoint}
      - {metric: requests_per_minute, limit: 20, scope: bulk-enrichment-endpoints}
      - {metric: requests_per_minute, limit: 1, scope: export-conversations}
    restrictions:
      - >-
        Free accounts registered with a PERSONAL email address cannot call people/company search or
        enrichment, retrieve complete person/company records, match contacts, or add people to prospects.
        Registering with a work email lifts this.
  - id: apollo-basic
    name: Basic
    type: paid
    price: '49'
    currency: USD
    period: month
    billing_duration: P1M
    description: Basic sales intelligence tools with contact access, CRM integrations, and email automation.
    api_access: true
    limits:
      - {metric: requests_per_minute, limit: 200, scope: per-team-per-endpoint}
      - {metric: requests_per_hour, limit: 400, scope: per-team-per-endpoint}
      - {metric: requests_per_day, limit: 2000, scope: per-team-per-endpoint}
      - {metric: requests_per_minute, limit: 1000, scope: enrichment-endpoints, note: no hourly or daily cap}
      - {metric: requests_per_hour, limit: 6000, scope: search-endpoints}
      - {metric: requests_per_day, limit: 50000, scope: search-endpoints}
  - id: apollo-professional
    name: Professional
    type: paid
    price: '99'
    currency: USD
    period: month
    billing_duration: P1M
    description: Advanced sales automation, engagement tracking, and AI-driven insights.
    api_access: true
    limits:
      - {metric: requests_per_minute, limit: 200, scope: per-team-per-endpoint}
      - {metric: requests_per_hour, limit: 400, scope: per-team-per-endpoint}
      - {metric: requests_per_day, limit: 2000, scope: per-team-per-endpoint}
      - {metric: requests_per_minute, limit: 1000, scope: enrichment-endpoints, note: no hourly or daily cap}
      - {metric: requests_per_hour, limit: 6000, scope: search-endpoints}
      - {metric: requests_per_day, limit: 50000, scope: search-endpoints}
  - id: apollo-enterprise
    name: Enterprise
    type: enterprise
    price: contact
    currency: USD
    period: custom
    description: >-
      Fully customizable sales intelligence platform with dedicated support, advanced analytics, and API
      access.
    api_access: true
    limits:
      - {metric: requests_per_minute, limit: 200, scope: per-team-per-endpoint}
      - {metric: requests_per_hour, limit: 600, scope: per-team-per-endpoint}
      - {metric: requests_per_day, limit: 6000, scope: per-team-per-endpoint}
    note: >-
      The rate-limits reference calls this fourth tier "Organization" while the pricing JSON-LD calls it
      "Enterprise". Both names are Apollo's own; recorded here as one tier because both describe the top
      contact-for-pricing plan.
credit_model:
  unit: credit
  description: >-
    Endpoints that create, update, list or manage records consume 0 credits. Enrichment, organization search,
    news search and AI-insight endpoints consume credits only when qualifying data is returned.
  docs: https://docs.apollo.io/docs/api-pricing
  charges:
    - {endpoint: people-enrichment, cost: 1-9 credits per person, detail: '1 credit for demographics/email; +8 credits if a mobile phone is returned. Email waterfall typically 1-4 credits (20+ in some vendor configurations); phone waterfall typically 8-25 credits (45+ in some configurations).'}
    - {endpoint: bulk-people-enrichment, cost: 1-9 credits per person, detail: Same logic as people enrichment; up to 10 people per request.}
    - {endpoint: organization-enrichment, cost: 1 credit per organization}
    - {endpoint: bulk-organization-enrichment, cost: 1 credit per organization}
    - {endpoint: organization-search, cost: 1 credit per page, detail: up to 100 results per page}
    - {endpoint: organization-jobs-postings, cost: 1 credit per page, detail: up to 10,000 results per page}
    - {endpoint: 'get_organizations{id}', cost: 1 credit per company}
    - {endpoint: 'get_people{id}', cost: 1 credit per person}
    - {endpoint: news_articles_search, cost: 1 credit per page, detail: up to 25 results per page}
    - {endpoint: get-conversations-info, cost: 1 credit per conversation, detail: only when the conversation has AI insights}
    - {endpoint: export-conversations, cost: 1 credit per conversation, detail: only when the conversation has AI insights}
  runtime_check:
    operationId: view-credit-usage-stats
    path: /usage_stats/credit_usage_stats
trial:
  available: true
  detail: >-
    Trial plans include 50 credits and 5 mobile credits plus almost all features of the selected plan.
    Linking a non-Gmail/Microsoft mailbox for email campaigns requires a paid plan. (Apollo pricing FAQ.)
mcp_pricing:
  additional_cost: 0
  note: There is no additional cost to connect Apollo MCP; plan, permissions and credit balance still apply.
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
