  - id: rfc8594-sunset
    name: 'RFC 8594: The Sunset HTTP Header'
    conforms: false
    evidence: No Sunset or Deprecation header documented; the one deprecated operation carries no removal date.
  - id: ratelimit-headers
    name: IETF RateLimit header fields (draft)
    conforms: false
    evidence: >-
      Apollo returns x-rate-limit-minute / x-rate-limit-hourly / x-rate-limit-24-hour / x-minute-usage /
      x-minute-requests-left and retry-after — its own vocabulary, not the RateLimit / RateLimit-Policy
