description: >-
  The entity-relationship graph of the Apollo API, derived from the published OpenAPI. Apollo's spec declares
  no components.schemas — every request and response body is inlined — so relationships were read from the
  id-reference fields (owner_id, account_id, contact_id, sequence_id, ...) rather than from $ref links.
  Field names are Apollo's own; nothing is inferred beyond what a reference field states.
schema_reuse:
  components_schemas: 0
  note: >-
    A real gap. With no named schemas, no two operations share a definition, so a generated client produces a
    distinct anonymous type per operation and consumers cannot bind to a stable Contact or Account shape.
