global_flags:
  - flag: --add-header <key:value>
    description: >-
      Add a custom HTTP header to the request; repeat to add several. Header names are normalized to
      lowercase. Must appear BEFORE the command group and subcommand.
output_formats:
  default: json
  flag: -f, --format
  formats:
    - {name: json, best_for: 'Pretty-printed structured output for scripts, AI agents and jq.'}
    - {name: jsonl, best_for: One JSON object per line for streaming and data pipelines.}
    - {name: csv, best_for: 'Flat exports for spreadsheets; nested objects are stringified into one cell.'}
    - {name: yaml, best_for: Human-readable inspection of deeply nested responses.}
    - {name: table, best_for: Quick terminal browsing of small responses.}
agent_notes:
  - Apollo positions the CLI as an agent surface — "works natively with AI coding agents like Claude Code and Cursor".
  - >-
    Search and list responses carry pagination metadata alongside the record array; CSV and table output
    stringify that array, so agents should use --format json and extract with jq.
  - >-
    --industry on people search expects Apollo industry tag IDs, not free text; free-text values return
    HTTP 422.
