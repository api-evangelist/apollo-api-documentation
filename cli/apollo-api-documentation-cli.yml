generated: '2026-08-14'
method: searched
source: https://docs.apollo.io/docs/apollo-cli-overview
provider: Apollo API Documentation
providerId: apollo-api-documentation
name: Apollo CLI
binary: apollo
description: >-
  Apollo ships a first-party CLI that gives shell-native access to the full Apollo API — search 240M+
  contacts, enrich people and companies, manage CRM records and run sequences from a terminal. Written in
  TypeScript, authenticated with OAuth 2.0 (no API key), pipeable with jq, and explicitly positioned by
  Apollo for AI coding agents like Claude Code and Cursor.
repository: https://github.com/apolloio/apollo-io-cli
docs: https://docs.apollo.io/docs/apollo-cli-overview
version: 2.1.0
released: '2026-08-07'
authentication:
  method: oauth2
  api_key_required: false
  commands: [apollo auth login, apollo auth logout, apollo auth whoami]
install:
  - method: homebrew
    recommended: true
    command: brew install apolloio/apollo-io-cli/apollo-io-cli
    alt: brew tap apolloio/apollo-io-cli && brew trust apolloio/apollo-io-cli && brew install apollo-io-cli
    upgrade: brew upgrade apollo-io-cli
    platforms: [macOS, Linux]
  - method: prebuilt-binary
    source: https://github.com/apolloio/apollo-io-cli/releases
    node_required: false
    platforms: [macOS, Linux, Windows]
  - method: from-source
    requires: Node.js 18 or above
    platforms: [macOS, Linux, Windows]
command_group_count: 20
command_count: 76
command_groups:
  - group: people
    theme: Research and prospect
    commands: [people search, people enrich, people bulk-enrich, people email, people get, people employees]
  - group: companies
    theme: Research and prospect
    commands: [companies search, companies enrich, companies bulk-enrich, companies get, companies jobs]
  - group: news
    theme: Research and prospect
