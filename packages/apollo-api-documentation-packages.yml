    repository: https://github.com/apolloio/n8n-nodes-apollo
    note: >-
      "Official Apollo.io n8n community node for lead enrichment and organization search." Version and date read
      from registry.npmjs.org dist-tags.latest + time. Published under the apolloio npm scope from the apolloio
      GitHub org, so first-party. Note the unscoped `n8n-nodes-apollo` on npm (0.2.0, 2026-05-13) is a
      third-party package from github.com/arturl95 and is NOT Apollo's — it is excluded from this artifact.
  - name: apollo-mcp-plugin
    official: true
    registry: github
    language: null
    kind: plugin
    version: null
