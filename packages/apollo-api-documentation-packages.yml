provider: Apollo API Documentation
providerId: apollo-api-documentation
description: >-
  First-party client distribution for Apollo. Apollo does NOT publish a language SDK for the REST API — the
  OpenAPI Specification page tells developers to generate their own client with OpenAPI Generator. What Apollo
  does ship first-party is a CLI (TypeScript, distributed via a Homebrew tap and GitHub release binaries, not
  npm), an official n8n community node on npm, and a Claude Code / Cowork plugin for its MCP server.
packages:
  - name: apollo-io-cli
    official: true
    registry: homebrew
    language: TypeScript
    kind: cli
    version: 2.1.0
    published: '2026-08-07'
    install: brew install apolloio/apollo-io-cli/apollo-io-cli
    repository: https://github.com/apolloio/apollo-io-cli
    docs: https://docs.apollo.io/docs/apollo-cli-overview
    releases: https://github.com/apolloio/apollo-io-cli/releases
    note: >-
      "The Official Apollo.io CLI". Version and date read from the GitHub release tag v2.1.0 (published
      2026-08-07) and package.json on main. NOT published to npm — registry.npmjs.org returns 404 for both
      `apollo-io-cli` and `@apollo-io/cli`, so there is no npm metadata endpoint to query. Distribution is a
      Homebrew tap (apolloio/homebrew-apollo-io-cli), prebuilt binaries on the GitHub releases page for
      macOS/Linux/Windows, or a build from source with Node.js 18+. Authenticates with OAuth 2.0; no API key.
  - name: '@apolloio/n8n-nodes-apollo'
    official: true
    registry: npm
    language: TypeScript
