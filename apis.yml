aid: apollo-api-documentation
name: Apollo API Documentation
description: Apollo.io is a sales intelligence and engagement platform. Its REST API provides programmatic access to a database
  of over 240 million contacts and 30 million companies, covering people and organization enrichment (single and bulk),
  people/company/news search, and go-to-market workflow management across accounts, contacts, deals, sequences, emails,
  tasks, calls, conversations, lists and custom fields. Apollo users authenticate with an API key in the x-api-key header;
  partners building on behalf of mutual users authenticate with OAuth 2.0. Apollo publishes a complete OpenAPI 3.1 specification,
  a hosted remote MCP server at mcp.apollo.io, and a first-party CLI.
