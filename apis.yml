aid: apollo-api-documentation
name: Apollo API Documentation
description: >-
  Apollo.io provides a comprehensive REST API for sales intelligence with over 210 million contacts and 35 million
  companies. The Apollo API enables data enrichment, people and organization search, CRM management, sequences, deals,
  analytics, and integrations. Authentication is via API keys or OAuth 2.0 for partner integrations. This repository
  profiles Apollo.io's API documentation as an example of API documentation best practices.
type: Index
