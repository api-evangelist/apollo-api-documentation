  /emailer_messages/get_content:
    post:
      summary: Get Email Content
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_messages/get_content` or `Master API key`


        **OAuth scopes:** `emailer_messages_get_content`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        Use the Get Email Content endpoint to retrieve the subject line, body, and recipients of emails that your team has
        already sent. Provide up to 10 email message IDs in a single request, and choose whether each body is returned as
        plain text or as the original HTML.<br><br>This endpoint only returns emails that your team sent and that Apollo has
        finished sending. Drafted, scheduled, and failed emails are never returned, and neither are replies or other inbound
        emails.<br><br>Any ID that doesn''t match one of your team''s sent emails is left out of the response instead of causing
        an error. This applies to unknown IDs, malformed IDs, IDs that belong to another team, and IDs for emails that aren''t
        sent outreach emails. Because of this, always match the results back to your request using the `id` field, and treat
        a missing `id` as "no sent email available" rather than a failure.<br><br>To find email message IDs, call the <a href="https://docs.apollo.io/reference/search-for-outreach-emails">Search
        for Outreach Emails endpoint</a> and identify the `id` value for each email.'
      tags:
      - Emailer Messages
      operationId: get-email-content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  description: 'The Apollo IDs of the sent emails whose content you want to retrieve. <br><br>Include a maximum
                    of 10 IDs per request. If you provide more than 10, Apollo uses the first 10 IDs and ignores the rest
                    without returning an error. <br><br>To find email message IDs, call the <a href="https://docs.apollo.io/reference/search-for-outreach-emails">Search
                    for Outreach Emails endpoint</a> and identify the `id` value for each email. <br><br>Example: `["66e8cc45028aed019c25d724",
                    "66e8cc45028aed019c25d725"]`'
                  items:
                    type: string
                body_format:
                  type: string
                  description: 'The format used to return the body of each email. <ul> <li> `plain` (default): the body is
                    returned as plain text, with the HTML tags removed. </li> <li> `html`: the body is returned as the original
                    HTML. </li> </ul>This value is case-sensitive. Any other value, including `HTML`, is treated as `plain`.
                    <br><br>Example: `html`'
                  enum:
                  - plain
                  - html
                  default: plain
            examples:
              Plain text body:
                value:
                  ids:
                  - 66e8cc45028aed019c25d724
              HTML body, multiple emails:
                value:
                  ids:
                  - 66e8cc45028aed019c25d724
                  - 66e8cc45028aed019c25d725
                  body_format: html
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK:
                  value:
                    emailer_messages:
                    - id: 66e8cc45028aed019c25d724
                      subject: Quick idea for Sumware
                      body: Hi Ava, great chatting yesterday.
                      body_format: plain
                      status: completed
                      sent_at: '2026-07-20T10:30:00+00:00'
                      recipients:
                      - email: ava.ruiz@sumware.com
                        type: to
                      - email: dev.patel@sumware.com
                        type: cc
                No matching sent emails:
                  value:
                    emailer_messages: []
              schema:
                type: object
                properties:
                  emailer_messages:
                    type: array
                    description: The sent emails that matched the IDs in your request, returned in the same order as the `ids`
                      array. IDs that don't match one of your team's sent emails are omitted, so this array can be shorter
                      than the `ids` array, or empty.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The Apollo ID of the email.
                        subject:
                          type:
                          - string
                          - 'null'
                          description: The subject line of the email. This is `null` if the email has no subject line.
                        body:
                          type:
                          - string
                          - 'null'
                          description: The body of the email, in the format given by `body_format`. If Apollo has no stored
                            body for the email, this is `null` when `body_format` is `html`, and an empty string when `body_format`
                            is `plain`.
                        body_format:
                          type: string
                          description: The format of the `body` value. This matches the `body_format` that Apollo applied
                            to your request.
                          enum:
                          - plain
                          - html
                        status:
                          type: string
                          description: The send status of the email. This is always `completed`, because the endpoint only
                            returns emails that Apollo has finished sending.
                          example: completed
                        sent_at:
                          type:
                          - string
                          - 'null'
                          description: The ISO 8601 timestamp for when Apollo finished sending the email. This is `null` if
                            no send-completion time was recorded for the email.
                        recipients:
                          type: array
                          description: The recipients of the email.
                          items:
                            type: object
                            properties:
                              email:
                                type: string
                                description: The email address of the recipient.
                              type:
                                type: string
                                description: The recipient type.
                                enum:
                                - to
                                - cc
                                - bcc
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Endpoint not in API key scope:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/emailer_messages/get_content.\
                    \ Request an API key from your administrator that includes this endpoint in its configured scope.\",\n\
                    \  \"error_code\": \"API_INACCESSIBLE\"\n}"
              schema:
                title: Endpoint not in API key scope
                type: object
                properties:
                  error:
                    type: string
                    example: This API key is not authorized to access api/v1/emailer_messages/get_content. Request an API
                      key from your administrator that includes this endpoint in its configured scope.
                  error_code:
                    type: string
                    example: API_INACCESSIBLE
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Missing ids:
                  value: '{"error": "Missing required parameter: ids"}'
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n    \"message\": \"The maximum number of api calls allowed for api/v1/emailer_messages/get_content\
                    \ is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\
                    \n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/emailer_messages/get_content is 600 times
                      per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
  /emailer_messages/email_send_status:
    post:
      summary: Check Email Send Status
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_messages/email_send_status` or `Master API key`


        **OAuth scopes:** `emailer_messages_email_send_status`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        Use the Check Email Send Status endpoint to check the current delivery status of an email message. This is typically
        used after calling the <a href="https://docs.apollo.io/reference/send-email-now">Send Email Now endpoint</a>, since
        emails are sent asynchronously and a successful send response only means the email was queued. <br><br>You must provide
        the `id` of the email message. The message must belong to your team, otherwise a `404` is returned.<br><br>The response
        always includes the message `id`, its current `status`, and a human-readable `message`. The remaining fields depend
        on the status:<ul><li>If the email was delivered (`completed`), a `completed_at` timestamp is included.</li><li>If
        the email failed (`failed`), a `not_sent_reason`, `failure_reason`, and `failed_at` timestamp may be included.</li><li>If
        the email is still being processed (like `drafted` or `scheduled`), a `retry_after_seconds` value is included to indicate
        how long to wait before checking again.</li></ul>'
      tags:
      - Emailer Messages
      operationId: check-email-send-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: 'The Apollo ID of the email message to check. This is the `id` returned when you create an
                    email draft or send an email. <br><br>Example: `66e8cc45028aed019c25d724`'
            examples:
              Check the status of an email:
                value:
                  id: 66e8cc45028aed019c25d724
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 66e8cc45028aed019c25d724
                  status:
                    type: string
                    example: completed
                  message:
                    type: string
                    example: Email delivered successfully.
                  completed_at:
                    type: string
                    format: date-time
                    example: '2025-02-03T15:30:00Z'
                  not_sent_reason:
                    type: string
                    example: no_active_email_account
                  failure_reason:
                    type: string
                    example: Mailbox disconnected
                  failed_at:
                    type: string
                    format: date-time
                    example: '2025-02-03T15:30:00Z'
                  retry_after_seconds:
                    type: integer
                    example: 10
              examples:
                Email delivered:
                  value:
                    id: 66e8cc45028aed019c25d724
                    status: completed
                    message: Email delivered successfully.
                    completed_at: '2025-02-03T15:30:00Z'
                Email failed:
                  value:
                    id: 66e8cc45028aed019c25d724
                    status: failed
                    message: Email failed to send.
                    not_sent_reason: no_active_email_account
                    failure_reason: Mailbox disconnected
                    failed_at: '2025-02-03T15:30:00Z'
                Email still being processed:
                  value:
                    id: 66e8cc45028aed019c25d724
                    status: scheduled
                    message: Email is still being processed. Try again in 10-20 seconds.
                    retry_after_seconds: 10
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Email message not found:
                  value: "{\n  \"error\": \"Email message not found\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Email message not found
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Missing required parameter:
                  value: "{\n  \"error\": \"Missing required parameter: id\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Missing required parameter: id'
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n  \"message\": \"The maximum number of api calls allowed for api/v1/emailer_messages/email_send_status\
                    \ is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\
                    \n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/emailer_messages/email_send_status is 600
                      times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
