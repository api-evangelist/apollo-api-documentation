  /mixed_companies/search:
    post:
      summary: Organization Search
      description: '## Endpoint essentials


        **API key access:** `api/v1/mixed_companies/search` or `Master API key`


        **OAuth scopes:** `mixed_companies_search`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1 credit per page`


        This endpoint consumes 1 Apollo credit per page, with up to 100 results per page. Learn more about [API pricing and
        credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4412658766477-Search-for-Companies" target="_blank">Organizations</a>
        are companies you haven''t yet saved as accounts on Apollo.<br><br>Use the Organization Search endpoint to find companies
        in the Apollo database. Several filters are available to help narrow your search.<br><br>To protect Apollo''s performance
        for all users, this endpoint has a display limit of 50,000 records (100 records per page, up to 500 pages). Add more
        filters to narrow your search results as much as possible.'
      tags:
      - Search
      operationId: organization-search
      parameters:
      - name: q_organization_domains_list[]
        in: query
        required: false
        description: 'The domain name for the person''s employer. This can be the current employer or a previous employer.
          Do not include `www.`, the `@` symbol, or similar. <br><br>This parameter accepts up to 1,000 domains in a single
          request. <br><br>Examples: `apollo.io`; `microsoft.com`'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: organization_num_employees_ranges[]
        in: query
        description: 'The number range of employees working for the company. This enables you to find companies based on headcount.
          You can add multiple ranges to expand your search results. <br><br>Each range you add needs to be a string, with
          the upper and lower numbers of the range separated only by a comma. <br><br>Examples: `1,10`; `250,500`; `10000,20000`'
        schema:
          type: array
          items:
            type: string
      - name: organization_locations[]
        in: query
        description: 'The location of the company headquarters. You can search across cities, US states, and countries. <br><br>If
          a company has several office locations, results are still based on the headquarters location. For example, if you
          search `chicago` but a company''s HQ location is in `boston`, any Boston-based companies will not appearch in your
          search results, even if they match other parameters.. <br><br>To exclude companies based on location, use the `organization_not_locations`
          parameter. <br><br>Examples: `texas`; `tokyo`; `spain`'
        schema:
          type: array
          items:
            type: string
      - name: organization_not_locations[]
        in: query
        description: 'Exclude companies from search results based on the location of the company headquarters. You can use
          cities, US states, and countries as locations to exclude. <br><br>This parameter is useful for ensuring you do not
          prospect in an undesirable territory. For example, if you use `ireland` as a value, no Ireland-based companies will
          appear in your search results. <br><br>Examples: `minnesota`; `ireland`; `seoul`'
        schema:
          type: array
          items:
            type: string
      - name: revenue_range[min]
        in: query
        description: 'Search for organizations based on their revenue. <br><br>Use this parameter to set the lower range of
          organization revenue. Use the `revenue_range[max]` parameter to set the upper range of revenue. <br><br>Do not enter
          currency symbols, commas, or decimal points in the figure. <br><br>Example: `300000`'
        schema:
          type: integer
      - name: revenue_range[max]
        in: query
        description: 'Search for organizations based on their revenue. <br><br>Use this parameter to set the upper range of
          organization revenue. Use the `revenue_range[min]` parameter to set the lower range of revenue. <br><br>Do not enter
          currency symbols, commas, or decimal points in the figure. <br><br>Example: `50000000`'
        schema:
          type: integer
      - name: currently_using_any_of_technology_uids[]
        in: query
        description: 'Find organizations based on the technologies they currently use. Apollo supports filtering by 1,500+
          technologies. <br><br>Apollo calculates technologies data from multiple sources. This data is updated regularly.
          Check out the full list of supported technologies by <a href="https://api.apollo.io/v1/auth/supported_technologies_csv"
          target="_blank">downloading this CSV file</a>. <br><br>Use underscores (`_`) to replace spaces and periods for the
          technologies listed in the CSV file. <br><br>Examples: `salesforce`; `google_analytics`; `wordpress_org`'
        schema:
          type: array
          items:
            type: string
      - name: q_organization_keyword_tags[]
        in: query
        description: 'Filter search results based on keywords associated with companies. For example, you can enter `mining`
          as a value to return only companies that have an association with the mining industry. <br><br>Examples: `mining`;
          `sales strategy`; `consulting`'
        schema:
          type: array
          items:
            type: string
      - name: q_organization_name
        in: query
        description: 'Filter search results to include a specific company name. <br><br>If the value you enter for this parameter
          does not match with a company''s name, the company will not appear in search results, even if it matches other parameters.
          Partial matches are accepted. For example, if you filter by the value `marketing`, a company called `NY Marketing
