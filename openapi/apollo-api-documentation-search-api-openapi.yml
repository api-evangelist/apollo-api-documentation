  /people/{id}:
    get:
      summary: Get Complete Person Info
      description: '## Endpoint essentials


        **API key access:** `api/v1/people/show` or `Master API key`


        **OAuth scopes:** `person_read`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1 credit per person` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        Use the Get Complete Person Info endpoint to retrieve complete details about a person in the Apollo database, including
        employment history, location, and the full details of the person''s current organization.


        ### Reading the `email` field


        This endpoint doesn''t reveal verified emails for people you haven''t saved as contacts. Instead of the address —
        and instead of `null` — `email` contains the fixed placeholder `email_not_unlocked@domain.com`, and every unrevealed
        person returns that same value.


        Because the placeholder is a non-empty string, it passes checks that assume an email is either usable or absent:


        * **Truthiness and null checks don''t catch it.** `if (person.email)` succeeds, so code may treat an unrevealed person
        as though you have their address.


        * **`email` breaks as a dedupe or upsert key.** Identical placeholders collapse unrelated people into one record.


        `email_status` does **not** distinguish it either: it describes the address Apollo holds internally, so it reads `verified`
        even when `email` is the placeholder. Use it to judge deliverability once you have a real address, not to decide whether
        you have one. The field only ever returns one of three values — `verified`, `extrapolated`, or `unavailable`.


        **Recommended handling:** compare `email` against the literal placeholder string and treat a match as "no email available
        yet". The response also omits `contact_id` and `revealed_for_current_team` for people who aren''t your contacts, which
        is a useful second signal. To get the real address, call [People Enrichment](https://docs.apollo.io/reference/people-enrichment)
        or [Bulk People Enrichment](https://docs.apollo.io/reference/bulk-people-enrichment), which never substitute the placeholder.


        | Person''s situation | `email` | `email_status` |

        | --- | --- | --- |

        | Verified email, not your contact | `email_not_unlocked@domain.com` | `verified` |

        | Verified email, already your contact | The contact''s real address | `verified` |

        | No verified email, but Apollo holds an extrapolated address | The extrapolated address | `extrapolated` |

        | No email available | `null` | `unavailable` |'
      tags:
      - Search
      operationId: get_people{id}
