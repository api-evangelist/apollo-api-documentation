              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                    example: 1039995589705121900
                    description: The request ID for the enrichment request. Save this ID to map this request with the corresponding
                      webhook result. <br><br>This is a signed 64-bit integer and is often negative, so store it in a type
                      that accommodates the full signed range.
                  status:
                    type: string
                    example: success
                    description: '`success` for any `200` response. Error responses return `failed` instead. <br><br>This
                      reflects the enrichment call itself, not whether any person was matched — a request that matches nobody
                      still returns `success`.'
                  error_code:
                    type:
                    - string
                    - 'null'
                    example: null
                    description: Always `null` on a `200` response. Populated only on error responses.
                  error_message:
                    type:
                    - string
                    - 'null'
                    example: null
                    description: Always `null` on a `200` response. Populated only on error responses.
                  total_requested_enrichments:
                    type: integer
                    example: 3
                    default: 0
                    description: The number of objects you sent in the `details[]` array. Always returned.
                  unique_enriched_records:
                    type: integer
                    example: 3
                    default: 0
                    description: The number of distinct people that consumed credits on this request. <br><br>This is a billing
                      count, not a match count. A person who was matched but returned no credit-consuming data isn't included,
                      so this can be lower than the number of entries in `matches` — or `0` while `matches` is non-empty.
                      Duplicate entries in `details[]` that resolve to the same person are counted once. <br><br>**Not returned**
                      when `run_waterfall_email` or `run_waterfall_phone` is `true`; those requests return the `waterfall`
                      object instead.
                  missing_records:
                    type: integer
                    example: 0
                    default: 0
                    description: The number of entries in `details[]` that Apollo couldn't match to a person in its database.
                      <br><br>**Not returned** when `run_waterfall_email` or `run_waterfall_phone` is `true`; those requests
                      return the `waterfall` object instead.
                  credits_consumed:
                    type: number
                    example: 3
                    default: 0
                    description: The total credits this request consumed. <br><br>This can be a fraction rather than a whole
                      number, depending on your plan's credit pricing, so parse it as a decimal rather than an integer. <br><br>**Not
                      returned** when `run_waterfall_email` or `run_waterfall_phone` is `true`; those requests return the
                      `waterfall` object instead. Waterfall credit usage is reported separately, since enrichment completes
                      asynchronously.
                  waterfall:
                    type: object
                    description: Returned **only** when you set `run_waterfall_email` or `run_waterfall_phone` to `true`.
                      It reports whether Apollo accepted the waterfall request, whose results arrive asynchronously at your
                      `webhook_url`. <br><br>When this object is present, `unique_enriched_records`, `missing_records`, and
                      `credits_consumed` are omitted from the response.
                    properties:
                      status:
                        type: string
                        example: accepted
                        description: Whether the waterfall enrichment request was accepted for asynchronous processing. A
                          `200` response with a non-accepted status means no webhook will be delivered — read `message` for
                          the reason.
                      message:
                        type: string
                        example: Waterfall enrichment request accepted. Results will be sent to the provided webhook URL.
                        description: A human-readable explanation of the waterfall status. When a request isn't accepted,
                          this states why — for example, that no waterfall enrichment template is configured for your team.
                      unprocessed_attributes:
                        type: array
                        description: Present only when some of the records you submitted couldn't be queued for waterfall
                          enrichment. Each entry echoes the attributes Apollo was unable to process.
                        items:
                          type: object
                  phone_enrichment:
                    type: object
                    description: Returned when you set `reveal_phone_number` to `true`, at least one person in `details[]`
                      was matched, and you aren't using `run_waterfall_phone`. Phone numbers are enriched asynchronously and
                      delivered to your `webhook_url`, so this object reports the status of that background work rather than
                      the numbers themselves. <br><br>If you requested `run_waterfall_phone` instead, phone status is reported
                      through the `waterfall` object.
                    properties:
                      request_id:
                        type: string
                        example: 64a7ff0cc4dfae00013df1a5
                        description: Identifier for the phone enrichment job. Returned only when status is `pending`.
                      status:
                        type: string
                        enum:
                        - pending
                        - skipped
                        example: pending
                        description: '`pending` means enrichment is running and a webhook will follow. `skipped` means the
                          matched people already had an enrichment in progress from an earlier request, so no webhook will
                          be sent for this request — the results arrive via the earlier request instead.'
                      message:
                        type: string
                        example: Phone enrichment is processing asynchronously. Retrieve the result by polling GET /api/v1/webhook_result/{request_id}
                          with the top-level `request_id` field from this response. Retry after ~10 seconds.
                        description: A human-readable explanation of the phone enrichment status, including how to retrieve
                          the result.
