  /organizations/bulk_enrich:
    post:
      summary: Bulk Organization Enrichment
      description: '## Endpoint essentials


        **API key access:** `api/v1/organizations/bulk_enrich` or `Master API key`


        **OAuth scopes:** `organizations_bulk_enrich`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1 credit per organization` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/33699917233293-Enrichment-Overview" target="_blank">Enrichment</a>
        is when you refresh existing records so your prospecting data is up-to-date.<br><br>Use the Bulk Organization Enrichment
        endpoint to enrich data for up to ten companies with a single API call. To enrich data for a single company, use the
        <a href="https://docs.apollo.io/reference/organization-enrichment">Organization Enrichment endpoint</a> instead.<br><br>You
        can identify the companies to enrich by providing a list of domains via the <code>domains[]</code> query parameter,
        or by providing a <code>details</code> array in the request body where each company can be matched by any combination
        of domain, LinkedIn URL, name, and website.<br><br>Enriched data potentially includes industry information, revenue,
        employee counts, funding round details, corporate phone numbers, locations, language counts, retail-location counts,
        and organization hierarchy data. The <code>owned_by_organization</code> field identifies the immediate parent, <code>owned_by_chain</code>
        lists parent organization IDs from the immediate parent to the ultimate parent, and <code>ultimate_parent_organization</code>
        identifies the topmost parent. Each result also includes <code>num_suborganizations</code> and <code>subsidiary_rollups</code>
        with the total estimated subsidiary employee count and distinct subsidiary countries and industries.'
      tags:
      - Enrichment
      operationId: bulk-organization-enrichment
      parameters:
      - name: domains[]
        in: query
        description: 'The domain of each company that you want to enrich. Do not include `www.`, the `@` symbol, or similar.
          <br><br>Use this parameter to match companies by domain only. To match by LinkedIn URL, name, or website in addition
          to domain, use the `details` array in the request body instead. <br><br>This parameter is required unless you provide
          a `details` payload in the request body. <br><br>Example: `apollo.io` and `microsoft.com`'
        required: false
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                details:
                  type: array
                  description: Provide info for each company you want to enrich as an object within this array. Add up to
                    10 companies. Each object can include any combination of `domain`, `linkedin_url`, `name`, and `website`.
                    Providing more than one value for a company improves match accuracy. <br><br>If you provide a `details`
                    payload, it takes precedence over the `domains[]` query parameter.
                  items:
                    properties:
                      domain:
                        type: string
                        description: 'The domain of the company that you want to enrich. Do not include `www.`, the `@` symbol,
                          or similar. <br><br>Example: `apollo.io` or `microsoft.com`'
                      linkedin_url:
                        type: string
                        description: 'The URL for the company''s LinkedIn profile. <br><br>Example: `http://www.linkedin.com/company/apolloio`'
                      name:
                        type: string
                        description: 'The name of the company that you want to enrich. <br><br>Example: `apollo`'
                      website:
                        type: string
                        description: 'The full website URL of the company that you want to enrich. <br><br>Example: `http://www.apollo.io`'
                    type: object
            examples:
              Match by domain:
                summary: Match by domain
                value:
                  details:
                  - domain: apollo.io
                  - domain: microsoft.com
              Match by domain, LinkedIn URL, name, or website:
                summary: Match by domain, LinkedIn URL, name, or website
                value:
                  details:
                  - domain: apollo.io
                    linkedin_url: http://www.linkedin.com/company/apolloio
                    name: apollo
                    website: http://www.apollo.io
                  - linkedin_url: http://www.linkedin.com/company/microsoft
                  - name: google
