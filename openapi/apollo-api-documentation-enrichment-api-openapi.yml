  /organizations/enrich:
    get:
      summary: Organization Enrichment
      description: '## Endpoint essentials


        **API key access:** `api/v1/organizations/enrich` or `Master API key`


        **OAuth scopes:** `organizations_enrich`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1 credit per organization` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/33699917233293-Enrichment-Overview" target="_blank">Enrichment</a>
        is when you refresh existing records so your prospecting data is up-to-date.<br><br>Use the Organization Enrichment
        endpoint to enrich data for one company. To enrich data for up to ten companies with a single API call, use the <a
        href="https://docs.apollo.io/reference/bulk-organization-enrichment">Bulk Organization Enrichment endpoint</a> instead.<br><br>You
        can match the company to enrich by domain, LinkedIn URL, name, and/or website. At least one of these is required,
        and providing more than one improves match accuracy.<br><br>Enriched data potentially includes industry information,
        revenue, employee counts, funding round details, corporate phone numbers, locations, language counts, retail-location
        counts, and organization hierarchy data. The <code>owned_by_organization</code> field identifies the immediate parent,
        <code>owned_by_chain</code> lists parent organization IDs from the immediate parent to the ultimate parent, and <code>ultimate_parent_organization</code>
        identifies the topmost parent. The <code>suborganizations</code> array includes each direct subsidiary''s industries,
        estimated employee count, and country when available.'
      tags:
      - Enrichment
      operationId: organization-enrichment
      parameters:
      - name: domain
        in: query
        description: 'The domain of the company that you want to enrich. Do not include `www.`, the `@` symbol, or similar.
          <br><br>At least one of `domain`, `linkedin_url`, `name`, or `website` is required. <br><br>Example: `apollo.io`
          or `microsoft.com`'
        required: false
        schema:
          type: string
      - name: linkedin_url
        in: query
        description: 'The URL for the company''s LinkedIn profile. <br><br>At least one of `domain`, `linkedin_url`, `name`,
          or `website` is required. <br><br>Example: `http://www.linkedin.com/company/apolloio`'
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: 'The name of the company that you want to enrich. <br><br>At least one of `domain`, `linkedin_url`, `name`,
          or `website` is required. <br><br>Example: `apollo`'
        required: false
        schema:
          type: string
      - name: website
        in: query
        description: 'The full website URL of the company that you want to enrich. <br><br>At least one of `domain`, `linkedin_url`,
          `name`, or `website` is required. <br><br>Example: `http://www.apollo.io`'
        required: false
