openapi: 3.1.0
info:
  title: Apollo API — Enrichment
  summary: Programmatic access to Apollo's sales intelligence and engagement platform — data enrichment, prospect and company
    search, and go-to-market workflow management.
  description: 'The Apollo API provides programmatic access to [Apollo](https://www.apollo.io/), the all-in-one sales intelligence
    and engagement platform. Use it to enrich people and company data (individually or in bulk), search Apollo''s database
    of over 240 million contacts and 30 million companies, and manage accounts, contacts, deals, sequences, tasks, calls,
    and conversations in your go-to-market workflows.


    ## Base URL


    All API requests are made to `https://api.apollo.io/api/v1`.


    ## Authentication


    - **Apollo users** authenticate with an API key passed in the `x-api-key` request header. See [Create API Keys](https://docs.apollo.io/docs/create-api-key).

    - **Apollo partners** building integrations on behalf of mutual users authenticate with the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).


    ## Rate limits & credits


    Rate limits and credit consumption depend on your [Apollo pricing plan](https://docs.apollo.io/docs/api-pricing). Check
    your current limits and usage with the [View API Usage Stats and Rate Limits](https://docs.apollo.io/reference/view-api-usage-stats)
    endpoint. For more details, see [Rate Limits](https://docs.apollo.io/reference/rate-limits) and the [API FAQs](https://docs.apollo.io/docs/apollo-api-faqs).


    New to the API? Start with the [Apollo API overview](https://docs.apollo.io/reference/apollo-api).'
  termsOfService: https://www.apollo.io/terms/api
  contact:
    name: Apollo API Support
    url: https://docs.apollo.io/
  version: '1.0'
servers:
- url: https://api.apollo.io/api/v1
tags:
- name: Enrichment
  description: Enrich people and company records, individually or in bulk.
security:
- apiKey: []
- bearerAuth: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: '[Recommended] API key, passed in the `x-api-key` request header.

        See [Create API Keys](https://docs.apollo.io/docs/create-api-key).'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 access token, used by Apollo partners building integrations.

        See the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).'
paths:
  /people/match:
    post:
      summary: People Enrichment
      description: '## Endpoint essentials


        **API key access:** `api/v1/people/match` or `Master API key`


        **OAuth scopes:** `people_match`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1–9 credits per person` without waterfall enrichment


        Credits are charged only if credit-consuming data is found: 1 credit for demographics or email, plus 8 credits if
        a mobile phone is returned. If no credit-consuming data is found, the request consumes 0 credits. Learn more about
        [API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        If waterfall enrichment is used for phone or email, credit usage depends on the returned data and the vendors included
        in your [waterfall enrichment configuration](https://knowledge.apollo.io/hc/en-us/articles/34071121664781-Use-Waterfall-Enrichment);
        some vendors consume credits per lookup even when no data is found.


        <a href="https://knowledge.apollo.io/hc/en-us/articles/33699917233293-Enrichment-Overview" target="_blank">Enrichment</a>
        is when you refresh existing records so your prospecting data is up-to-date.<br><br>Use the People Enrichment endpoint
        to enrich data for one person. To enrich data for up to ten people with a single API call, use the <a href="https://docs.apollo.io/reference/bulk-people-enrichment">Bulk
        People Enrichment endpoint</a> instead.<br><br>Apollo relies on the information you pass via the endpoint''s parameters
        to identify the correct person to enrich. If you provide more information about a person, Apollo is more likely to
        find a match within its database. If you only provide general information, such as a name without a domain or email
        address, you might receive a `200` response, but the response indicates that no records have been enriched.<br><br>By
        default, this endpoint doesn''t return personal emails or phone numbers. Use the `reveal_personal_emails` and `reveal_phone_number`
        parameters to retrieve emails and phone numbers.<br><br>When you use `reveal_phone_number`, a valid `webhook_url`
        is required so Apollo can deliver the completed phone enrichment results. Apollo returns the main enrichment response
        synchronously, then sends the requested phone numbers to the webhook asynchronously. [See webhook details](#webhook-details).<br><br>You
        can also use the `run_waterfall_email` and `run_waterfall_phone` parameters to run waterfall enrichment via this endpoint.
        [Waterfall enrichment](https://knowledge.apollo.io/hc/en-us/articles/34071089002509-Waterfall-Enrichment-Overview)
        gives you broader data coverage by checking connected third-party data sources for contact emails and phone numbers.<br><br>When
        you call this endpoint and include at least one waterfall parameter, a valid `webhook_url` is required so Apollo can
        deliver the completed waterfall enrichment results. Apollo returns an immediate synchronous response with demographic
        and firmographic data, along with a waterfall enrichment request status. Apollo then delivers enriched emails or phone
        numbers asynchronously to the configured webhook.


        ### Webhook Details


        - When using Apollo enrichment for phone number reveal, the webhook response follows: [Native webhook response details](doc:retrieve-mobile-phone-numbers-for-contacts#webhook-response-details).


        - When using waterfall enrichment, the webhook response follows: [Waterfall webhook response details](doc:enrich-phone-and-email-using-data-waterfall#response-details).


        - You can poll webhook results with the [poll webhook result](doc:poll-webhook-result) endpoint by passing the <code>request_id</code>
        from the people enrichment response.


        ### Webhook Requirements


        - **HTTPS Required:** Your endpoint must be publicly accessible over HTTPS.


        - **Rate Limiting:** Ensure your webhook endpoint can handle the volume of webhook traffic sent by Apollo.


        - **Idempotency:** Apollo may retry webhook calls; your endpoint should be idempotent to handle duplicate payloads
        safely.'
      tags:
      - Enrichment
      operationId: people-enrichment
      parameters:
      - name: first_name
        in: query
        description: 'The first name of the person. This is typically used in combination with the `last_name` parameter.
          <br><br>Example: `tim`'
        schema:
          type: string
      - name: last_name
        in: query
        description: 'The last name of the person. This is typically used in combination with the `first_name` parameter.
          <br><br>Example: `zheng`'
        schema:
          type: string
      - name: name
        in: query
        description: 'The full name of the person. This will typically be a first name and last name separated by a space.  If
          you use this parameter, you do not need to use the `first_name` and `last_name` parameters. <br><br>Example: `tim
          zheng`'
        schema:
          type: string
      - name: email
        in: query
        description: 'The email address of the person. <br><br>Example: `example@email.com`'
        schema:
          type: string
      - name: hashed_email
        in: query
        description: 'The hashed email of the person. The email should adhere to either the MD5 or SHA-256 hash format. <br><br>Example:
          `8d935115b9ff4489f2d1f9249503cadf` (MD5) or `97817c0c49994eb500ad0a5e7e2d8aed51977b26424d508f66e4e8887746a152` (SHA-256)'
        schema:
          type: string
      - name: organization_name
        in: query
        description: 'The name of the person''s employer. This can be the current employer or a previous employer. <br><br>Example:
          `apollo`'
        schema:
          type: string
      - name: domain
        in: query
        description: 'The domain name for the person''s employer. This can be the current employer or a previous employer.
          Do not include `www.`, the `@` symbol, or similar. <br><br>Example: `apollo.io` or `microsoft.com`'
        schema:
          type: string
      - name: id
        in: query
        description: 'The Apollo ID for the person. Each person in the Apollo database is assigned a unique ID. <br><br>To
          find IDs, call the <a href="https://docs.apollo.io/reference/people-api-search" target="_blank">People API Search
          endpoint</a> and identify the values for `person_id`. <br><br>Example: `587cf802f65125cad923a266`'
        schema:
          type: string
      - name: linkedin_url
        in: query
        description: 'The URL for the person''s LinkedIn profile. <br><br>Example: `http://www.linkedin.com/in/tim-zheng-677ba010`'
        schema:
          type: string
      - name: run_waterfall_email
        in: query
        description: Set to true to enable email waterfall enrichment
        schema:
          type: boolean
          default: false
      - name: run_waterfall_phone
        in: query
        description: Set to true to enable phone waterfall enrichment
        schema:
          type: boolean
          default: false
      - name: reveal_personal_emails
        in: query
        description: Set to `true` if you want to enrich the person's data with personal emails. This potentially consumes
          credits as part of your <a href="https://docs.apollo.io/docs/api-pricing" target="_blank">Apollo pricing plan</a>.
          The default value is `false`. <br><br>If a person resides in a <a href="https://knowledge.apollo.io/hc/en-us/articles/4409141087757"
          target="_blank">GDPR</a>-compliant region, Apollo will not reveal their personal email.
        schema:
          type: boolean
          default: false
      - name: reveal_phone_number
        in: query
        description: Set to `true` if you want to enrich the person's data with all available phone numbers, including mobile
          phone numbers. This potentially consumes credits as part of your <a href="https://docs.apollo.io/docs/api-pricing"
          target="_blank">Apollo pricing plan</a>. The default value is `false`. <br><br>If this parameter is set to `true`,
          you must enter a webhook URL for the `webhook_url` parameter. Apollo will asynchronously verify phone numbers for
          you, then send a JSON response that includes only details about the person's phone numbers to the webhook URL you
          provide. It can take several minutes for the phone numbers to be delivered.
        schema:
          type: boolean
          default: false
      - name: webhook_url
        in: query
        description: 'If you set the `reveal_phone_number` parameter to `true`, this parameter becomes mandatory. Otherwise,
          do not use this parameter. <br><br>Enter the webhook URL that specifies where Apollo should send a JSON response
          that includes the phone number you requested. Apollo suggests testing this flow to ensure you receive the separate
          response with the phone number. <br><br>If phone numbers are not revealed delivered to the webhook URL, try applying
          UTF-8 encoding to the webhook URL. <br><br>Example: `https://webhook.site/11f2643a-b1b4-c6be-8e6a-6c7da2c12610`;
          `https%3A%2F%2Fwebhook.site%2F11f2643a-b1b4-c6be-8e6a-6c7da2c12610`'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
