  /people/bulk_match:
    post:
      summary: Bulk People Enrichment
      description: '## Endpoint essentials


        **API key access:** `api/v1/people/bulk_match` or `Master API key`


        **OAuth scopes:** `people_bulk_match`


        **Free account access:** Requires an Apollo account registered with a work email address. Paid accounts aren''t affected.


        **Credit usage:** `1–9 credits per person` without waterfall enrichment


        Credits are charged only if credit-consuming data is found: 1 credit for demographics or email, plus 8 credits if
        a mobile phone is returned. If no credit-consuming data is found, the request consumes 0 credits. You can enrich up
        to 10 people per request. Learn more about [API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        If waterfall enrichment is used for phone or email, credit usage depends on the returned data and the vendors included
        in your [waterfall enrichment configuration](https://knowledge.apollo.io/hc/en-us/articles/34071121664781-Use-Waterfall-Enrichment);
        some vendors consume credits per lookup even when no data is found.


        <a href="https://knowledge.apollo.io/hc/en-us/articles/33699917233293-Enrichment-Overview" target="_blank">Enrichment</a>
        is when you refresh existing records so your prospecting data is up-to-date.<br><br>Use the Bulk People Enrichment
        endpoint to enrich data for up to ten people with a single API call. To enrich data for a single person, use the <a
        href="https://docs.apollo.io/reference/people-enrichment">People Enrichment endpoint</a> instead.<br><br>Apollo relies
        on the information you pass via the endpoint''s parameters to identify the correct people to enrich. When you provide
        more information, Apollo is more likely to find matches within its database. If you only provide general information,
        such as a name without a domain or email address, you may receive a `200` response, but the response indicates that
        no records have been enriched. The details for each person should be passed as an object in the `details[]` array.<br><br>By
        default, this endpoint doesn''t return personal emails or phone numbers. Use the `reveal_personal_emails` parameter
        to retrieve personal emails and `reveal_phone_number` to retrieve phone numbers. If you set either of these parameters
        to `true`, Apollo attempts to provide emails or phone numbers for all matches.<br><br>When you use `reveal_phone_number`,
        a valid `webhook_url` is required so Apollo can deliver the completed phone enrichment results. Apollo returns the
        main enrichment response synchronously, then sends the requested phone numbers to the webhook asynchronously. [See
        webhook details](#webhook-details).<br><br>You can also use the `run_waterfall_email` and `run_waterfall_phone` parameters
        to run waterfall enrichment via this endpoint. [Waterfall enrichment](https://knowledge.apollo.io/hc/en-us/articles/34071089002509-Waterfall-Enrichment-Overview)
        gives you broader data coverage by checking connected third-party data sources for contact emails and phone numbers.<br><br>When
        you call this endpoint and include at least one waterfall parameter, a valid `webhook_url` is required so Apollo can
        deliver the completed waterfall enrichment results. Apollo returns an immediate synchronous response with demographic
        and firmographic data, along with a waterfall enrichment request status. Apollo then delivers enriched emails or phone
        numbers asynchronously to the configured webhook.<br><br>


        ### Reading the Response


        The response shape depends on whether you requested waterfall enrichment, so check for the fields you need rather
        than assuming a fixed payload.


        **Standard requests** (no waterfall parameters) return `total_requested_enrichments`, `unique_enriched_records`, `missing_records`,
        and `credits_consumed` alongside `matches`.


        **Waterfall requests** (`run_waterfall_email` or `run_waterfall_phone` set to `true`) return a `waterfall` object
        instead. On these, `unique_enriched_records`, `missing_records`, and `credits_consumed` are **absent entirely** —
        not zero — because enrichment is still running and final credit usage isn''t known. Only `total_requested_enrichments`
        appears in both shapes. When `run_waterfall_email` is `true`, each `matches` entry also omits `email` and `email_status`,
        since the address arrives later via your webhook.


        Also worth knowing:


        * `unique_enriched_records` counts distinct people that **consumed credits**, not people that matched. It can be lower
        than the length of `matches`, or `0` while `matches` is non-empty.


        * `credits_consumed` can be fractional depending on your plan''s credit pricing. Parse it as a decimal.


        * `request_id` is a signed 64-bit integer and is frequently negative. Store it in a type that handles the full signed
        range, and pass it unchanged to [Poll Webhook Result](https://docs.apollo.io/reference/poll-webhook-result).


        * `status` is `success` for any `200` response, including one that matched nobody. Use `missing_records` and `matches`
        to judge what was actually enriched.


        ### Webhook Details


        * When using native phone enrichment, the webhook response follows: [Native webhook response details](doc:retrieve-mobile-phone-numbers-for-contacts#webhook-response-details).


        * When using waterfall enrichment, the webhook response follows: [Waterfall webhook response details](doc:enrich-phone-and-email-using-data-waterfall#response-details).


        * You can poll webhook results with the <a href="https://docs.apollo.io/reference/poll-webhook-result">Poll Webhook
        Result</a> endpoint by passing the <code>request_id</code> from the bulk people enrichment response.


        ### Webhook Requirements


        * **HTTPS Required:** Your endpoint must be publicly accessible over HTTPS.


        * **Rate Limiting:** Ensure your webhook endpoint can handle the volume of webhook traffic sent by Apollo.


        * **Idempotency:** Apollo may retry webhook calls. Your endpoint should be idempotent to handle duplicate payloads
        safely.'
      tags:
      - Enrichment
      operationId: bulk-people-enrichment
      parameters:
      - name: run_waterfall_email
        in: query
        description: Set to true to enable email waterfall enrichment
        schema:
          type: boolean
          default: false
      - name: run_waterfall_phone
        in: query
        description: Set to true to enable phone waterfall enrichment
        schema:
          type: boolean
          default: false
      - name: reveal_personal_emails
        in: query
        description: Set to `true` if you want to enrich all matched people with personal emails. This potentially consumes
          credits as part of your <a href="https://docs.apollo.io/docs/api-pricing" target="_blank">Apollo pricing plan</a>.
          The default value is `false`. <br><br>If a person resides in a <a href="https://knowledge.apollo.io/hc/en-us/articles/4409141087757"
          target="_blank">GDPR</a>-compliant region, Apollo will not reveal their personal email.
        schema:
          type: boolean
          default: false
      - name: reveal_phone_number
        in: query
        description: Set to `true` if you want to enrich the data of all matched people with all available phone numbers,
          including mobile phone numbers. This potentially consumes credits as part of your <a href="https://docs.apollo.io/docs/api-pricing"
          target="_blank">Apollo pricing plan</a>. The default value is `false`. <br><br>If this parameter is set to `true`,
          you must enter a webhook URL for the `webhook_url` parameter. Apollo will asynchronously verify phone numbers for
          you, then send a JSON response that includes only details about the phone numbers to the webhook URL you provide.
          It can take several minutes for the phone numbers to be delivered.
        schema:
          type: boolean
          default: false
      - name: webhook_url
        in: query
        description: 'If you set the `reveal_phone_number` parameter to `true`, this parameter becomes mandatory. Otherwise,
          do not use this parameter. <br><br>Enter the webhook URL that specifies where Apollo should send a JSON response
          that includes the phone number you requested. Apollo suggests testing this flow to ensure you receive the separate
          response with the phone number. <br><br>If phone numbers are not revealed delivered to the webhook URL, try applying
          UTF-8 encoding to the webhook URL. <br><br>Example: `https://webhook.site/11f2643a-b1b4-c6be-8e6a-6c7da2c12610`;
          `https%3A%2F%2Fwebhook.site%2F11f2643a-b1b4-c6be-8e6a-6c7da2c12610`'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - details
              properties:
                details:
                  type: array
                  description: Provide info for each person you want to enrich as an object within this array. Add up to 10
                    people.
                  items:
                    properties:
                      first_name:
                        type: string
                        description: 'The first name of the person. This is typically used in combination with the `last_name`
                          parameter. <br><br>Example: `tim`'
                      last_name:
