  /accounts/bulk_create:
    post:
      summary: Bulk Create Accounts
      description: '## Endpoint essentials


        **API key access:** `api/v1/accounts/bulk_create` or `Master API key`


        **OAuth scopes:** `account_bulk_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        An <a href="https://knowledge.apollo.io/hc/en-us/articles/5995865049229-View-and-Edit-Accounts" target="_blank">account</a>
        is a company saved in Apollo.<br><br>Use the bulk create accounts endpoint to create up to one hundred accounts in
        a single API request. This endpoint supports intelligent deduplication and returns separate arrays for newly created
        and existing accounts. <br><br>**Important**: This endpoint creates new accounts but doesn''t update existing ones.
        Existing accounts that match the criteria are returned in the <code>existing_accounts</code> array without modification.
        <br><br>To update existing accounts, use the <a href="https://docs.apollo.io/reference/bulk-update-accounts">Bulk
        Update Accounts endpoint</a>.'
      tags:
      - Accounts
      operationId: bulk-create-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accounts
              properties:
                accounts:
                  type: array
                  description: Array of account attribute objects (maximum 100 accounts per request)
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Account name
                        example: Acme Corporation
                      domain:
                        type: string
                        description: Company domain (e.g., 'example.com')
                        example: acme.com
                      owner_id:
                        type: string
                        description: Account owner user ID (BSON::ObjectId format). Defaults to current user if not provided
                        example: 507f1f77bcf86cd799439013
                      phone:
                        type: string
                        description: Company phone number
                        example: +1-555-0135
                      phone_status_cd:
                        type: string
                        description: Phone validation status
                      raw_address:
                        type: string
                        description: Company address
                        example: 123 Main St, San Francisco, CA 94105
                      linkedin_url:
                        type: string
                        description: LinkedIn company page URL
                        example: https://linkedin.com/company/acme
                      facebook_url:
                        type: string
                        description: Facebook page URL
                        example: https://facebook.com/acme
                      twitter_url:
                        type: string
                        description: Twitter profile URL
                        example: https://twitter.com/acme
                      salesforce_id:
                        type: string
                        description: Salesforce account ID for CRM integration
                        example: 001pJNj9pix2idKsfj
                      hubspot_id:
                        type: string
                        description: HubSpot company ID for CRM integration
                        example: '12345678'
                      merged_crm_ids:
                        type: array
                        description: Additional CRM IDs for deduplication
                        items:
                          type: string
                      organization_id:
                        type: string
                        description: Apollo organization ID
                        example: 507f1f77bcf86cd799439012
                      parent_account_id:
                        type: string
                        description: Parent account ID for account hierarchy (BSON::ObjectId format)
                        example: 507f1f77bcf86cd799439016
                      account_stage_id:
                        type: string
                        description: Account stage/pipeline stage ID (BSON::ObjectId format)
                        example: 507f1f77bcf86cd799439014
                      typed_custom_fields:
                        type: object
                        description: Custom field values as key-value pairs where key is the field_id and value is the field_value
                        additionalProperties:
                          type: string
                        example:
                          507f1f77bcf86cd799439020: High Value
                          507f1f77bcf86cd799439021: Q4 2025
                append_label_names:
                  type: array
                  description: Array of label names to add to ALL accounts in this request
                  items:
                    type: string
                  example:
                  - Enterprise
                  - High Priority
                run_dedupe:
                  type: boolean
                  description: Enable aggressive deduplication by domain, organization_id, and name. When false (default),
                    only matches by CRM IDs. When true, also matches by domain, organization_id, and name. Existing accounts
                    are returned without modification in both modes
                  default: false
                  example: true
            examples:
              Basic Account Creation:
                value:
                  accounts:
                  - name: Acme Corporation
                    domain: acme.com
                    phone: +1-555-0135
                  - name: TechStart Inc
                    domain: example.com
                    linkedin_url: https://linkedin.com/company/techstart
              With Deduplication (Returns Existing Without Updating):
                value:
                  accounts:
                  - domain: existing-company.com
                    name: New Company Name
                  run_dedupe: true
              With CRM IDs (Returns Existing Without Updating):
                value:
                  accounts:
                  - salesforce_id: 001pJNj9pix2idKsfj
                    name: New Name
                    phone: +1-555-0159
                  - hubspot_id: '12345678'
                    name: Another New Name
              With Custom Fields and Labels:
                value:
                  accounts:
                  - name: Enterprise Client
                    domain: example.com
                    account_stage_id: 507f1f77bcf86cd799439014
                    typed_custom_fields:
                      507f1f77bcf86cd799439020: High Value
                      507f1f77bcf86cd799439021: Q4 2025
                  append_label_names:
                  - Enterprise
                  - Priority
      responses:
        '200':
          description: 200 - Successful bulk create operation
          content:
            application/json:
              examples:
                Result:
                  value:
                    created_accounts:
                    - id: 507f1f77bcf86cd799439011
                      name: Acme Corporation
                      domain: acme.com
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      account_stage_id: 507f1f77bcf86cd799439014
                      phone: +1-555-0135
                      created_at: '2025-10-16T18:30:00Z'
                      updated_at: '2025-10-16T18:30:00Z'
                    - id: 507f1f77bcf86cd799439017
                      name: TechStart Inc
                      domain: example.com
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      linkedin_url: https://linkedin.com/company/techstart
                      created_at: '2025-10-16T18:30:00Z'
                      updated_at: '2025-10-16T18:30:00Z'
                    existing_accounts:
                    - id: 507f1f77bcf86cd799439015
                      name: Original Company Name
                      domain: existing.com
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      created_at: '2025-09-01T10:00:00Z'
                      updated_at: '2025-09-15T14:30:00Z'
              schema:
                type: object
                properties:
                  created_accounts:
                    type: array
                    description: Array of newly created accounts
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Account ID
                          example: 507f1f77bcf86cd799439011
                        name:
                          type: string
                          description: Account name
                          example: Acme Corporation
                        domain:
                          type: string
                          description: Company domain
                          example: acme.com
                        team_id:
                          type: string
                          description: Team ID
                          example: 507f1f77bcf86cd799439012
                        owner_id:
                          type: string
                          description: Account owner ID
                          example: 507f1f77bcf86cd799439013
                        account_stage_id:
                          type: string
                          description: Account stage ID
                          example: 507f1f77bcf86cd799439014
                        phone:
                          type: string
                          description: Company phone number
                          example: +1-555-0135
                        created_at:
                          type: string
                          format: date-time
                          description: Account creation timestamp
                          example: '2025-10-16T18:30:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Account last update timestamp
                          example: '2025-10-16T18:30:00Z'
                  existing_accounts:
                    type: array
                    description: Array of existing accounts that matched deduplication criteria (returned without modification)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Account ID
                          example: 507f1f77bcf86cd799439015
                        name:
                          type: string
                          description: Account name
                          example: Original Company Name
                        domain:
                          type: string
                          description: Company domain
                          example: existing.com
                        team_id:
                          type: string
                          description: Team ID
                          example: 507f1f77bcf86cd799439012
                        owner_id:
                          type: string
                          description: Account owner ID
                          example: 507f1f77bcf86cd799439013
                        created_at:
                          type: string
                          format: date-time
                          description: Account creation timestamp
                          example: '2025-09-01T10:00:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Account last update timestamp
                          example: '2025-09-15T14:30:00Z'
        '401':
          description: 401 - Unauthorized
          content:
            text/plain:
              examples:
                Invalid API Key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '422':
          description: 422 - Unprocessable Entity
          content:
            application/json:
              examples:
                Missing accounts parameter:
                  value: "{\n  \"error\": \"Please provide an array of account attributes in the \\\"accounts\\\" parameter.\"\
                    \n}"
                Too many accounts:
                  value: "{\n  \"error\": \"Please limit your array to 100 accounts or fewer.\"\n}"
                Invalid accounts parameter:
                  value: "{\n  \"error\": \"Please provide an array of account attributes in the \\\"accounts\\\" parameter.\"\
                    \n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Please provide an array of account attributes in the "accounts" parameter.
        '429':
          description: 429 - Too Many Requests
          content:
            application/json:
              examples:
                Rate limit exceeded:
                  value: "{\n  \"message\": \"The maximum number of api calls allowed for api/v1/accounts/bulk_create is 600\
                    \ times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/accounts/bulk_create is 600 times per hour.
                      Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
        '500':
          description: 500 - Internal Server Error
          content:
            application/json:
              examples:
                Server error:
                  value: "{\n  \"error\": \"An error occurred while creating accounts. Please try again.\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: An error occurred while creating accounts. Please try again.
      deprecated: false
  /accounts/bulk_update:
    post:
      summary: Bulk Update Accounts
      description: '## Endpoint essentials


        **API key access:** `api/v1/accounts/bulk_update` or `Master API key`


        **OAuth scopes:** `account_stages_update`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        An <a href="https://knowledge.apollo.io/hc/en-us/articles/5995865049229-View-and-Edit-Accounts" target="_blank">account</a>
        is a company saved in Apollo.<br><br>Use the Bulk Update Accounts endpoint to simultaneously update multiple accounts
        in your team''s Apollo account. <br><br>This endpoint allows you to update common fields across multiple accounts
        efficiently, such as account stages, owners, names, and custom fields. <br><br>You can update up to 1,000 accounts
        per request.<br><br><b>Important:</b> Asynchronous processing (async parameter) is only supported when using <code>account_ids</code>
        to apply the same updates to all accounts. If you use async with <code>account_attributes</code> (individual updates
        per account), the request fails with a 422 error.'
      tags:
      - Accounts
      operationId: bulk-update-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_ids:
                  type: array
                  description: Array of account IDs to update with the same values. Use this for applying the same updates
                    to multiple accounts.
                  items:
                    type: string
                  example:
                  - 66e9abf95ac32901b20d1a0d
                  - 66e9a4db056fe802d331fb8a
                account_attributes:
                  type: array
                  description: Array of account objects with individual updates. Use this for applying different updates to
                    each account.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The account ID to update
                        example: 66e9abf95ac32901b20d1a0d
                      name:
                        type: string
                        description: The account name
                        example: Acme Corporation
                      owner_id:
                        type: string
                        description: The Apollo user ID to assign as owner
                        example: 66302798d03b9601c7934ebf
                      account_stage_id:
                        type: string
                        description: The Apollo account stage ID
                        example: 6095a710bd01d100a506d4b7
                      typed_custom_fields:
                        type: object
                        description: Custom field values as key-value pairs
                        additionalProperties:
                          type: string
                        example:
                          60c39ed82bd02f01154c470a: '2025-08-07'
                    required:
                    - id
                name:
                  type: string
                  description: When using account_ids, apply this name to all accounts
                  example: Updated Account Name
                owner_id:
                  type: string
                  description: When using account_ids, apply this owner to all accounts
                  example: 66302798d03b9601c7934ebf
                account_stage_id:
                  type: string
                  description: When using account_ids, apply this account stage to all accounts
                  example: 6095a710bd01d100a506d4b7
                async:
                  type: boolean
                  description: Set to true to process updates asynchronously. Only available when using account_ids. Not supported
                    with account_attributes.
                  example: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"accounts\": [\n    {\n      \"id\": \"66e9abf95ac32901b20d1a0d\",\n      \"account_stage_id\"\
                    : \"6095a710bd01d100a506d4b7\"\n    },\n    {\n      \"id\": \"66e9a4db056fe802d331fb8a\",\n      \"account_stage_id\"\
                    : \"6095a710bd01d100a506d4b7\"\n    },\n    {\n      \"id\": \"66e9a7866e440201b42ac31d\",\n      \"account_stage_id\"\
                    : \"6095a710bd01d100a506d4b7\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 66e9abf95ac32901b20d1a0d
                        account_stage_id:
                          type: string
                          example: 6095a710bd01d100a506d4b7
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Need master API key:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/accounts/bulk_update. Request\
                    \ an API key from your administrator that includes this endpoint in its configured scope.\",\n  \"error_code\"\
                    : \"API_INACCESSIBLE\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This API key is not authorized to access api/v1/accounts/bulk_update. Request an API key from
                      your administrator that includes this endpoint in its configured scope.
                  error_code:
                    type: string
                    example: API_INACCESSIBLE
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Async not permitted with account_attributes:
                  value: "{\n  \"error\": \"Async processing is not permitted.\"\n}"
                Too many accounts:
                  value: "{\n  \"error\": \"Please limit your array to fewer than 1000.\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Async processing is not permitted.
        '429':
          description: '429'
