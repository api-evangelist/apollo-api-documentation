  /emailer_campaigns/{sequence_id}/add_contact_ids:
    post:
      summary: Add Contacts to a Sequence
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_campaigns/add_contact_ids` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_add_contact_ids`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Add Contacts to a Sequence endpoint to add contacts to the existing sequences in your team''s Apollo account.<br><br>A
        contact is a person that your team has explicitly added to your database. Only contacts can be added to sequences.
        To enrich a person''s data, call the <a href="https://docs.apollo.io/reference/people-enrichment">People Enrichment
        endpoint</a>. Then, to add the person as a contact in your database, call the <a href="https://docs.apollo.io/reference/create-a-contact">Create
        a Contact endpoint</a>.'
      tags:
      - Sequences
      operationId: add-contacts-to-sequence
      parameters:
      - name: sequence_id
        in: path
        description: 'The Apollo ID for the sequence to which you want to add contacts. <br><br>To find sequence IDs, call
          the <a href="https://docs.apollo.io/reference/search-for-sequences" target="_blank">Search for Sequences endpoint</a>
          and identify the `id` value for the sequence. <br><br>Example: `66e9e215ece19801b219997f`'
        required: true
        schema:
          type: string
      - name: emailer_campaign_id
        in: query
        description: 'The same ID as the `sequence_id`. <br><br>Example: `66e9e215ece19801b219997f`'
        required: true
        schema:
          type: string
      - name: contact_ids[]
        in: query
        description: 'The Apollo IDs for the contacts that you want to add to the sequence. <br><br>To find contact IDs, call
          the <a href="https://docs.apollo.io/reference/search-for-contacts" target="_blank">Search for Contacts endpoint</a>
          and identify the `id` value for the contact. <br><br>Example: `66e34b81740c50074e3d1bd4`<br><br>Note: Either `contact_ids[]`
          or `label_names[]` must be provided.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: label_names[]
        in: query
        description: 'Alternative to `contact_ids[]`. Array of label names to identify contacts to add to the sequence. Contacts
          with these labels will be added to the sequence. <br><br>Note: Either `contact_ids[]` or `label_names[]` must be
          provided.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: send_email_from_email_account_id
        in: query
        description: 'The Apollo ID(s) for the email account(s) used to send to contacts you add to the sequence. Accepts
          either one id as a string, or multiple ids as an array of strings (multi-mailbox / rotation). To find email account
          IDs, call the <a href="https://docs.apollo.io/reference/get-a-list-of-email-accounts" target="_blank">Get a List
          of Email Accounts endpoint</a> and identify the `id` value for each email account. <br><br>Examples: `6633baaece5fbd01c791d7ca`
          (string) or `["6633baaece5fbd01c791d7ca", "6633baaece5fbd01c791d7cb"]` (array).'
        required: true
        schema:
          oneOf:
          - type: string
            description: Single email account ID.
          - type: array
            items:
              type: string
            minItems: 1
            description: One or more email account IDs.
      - name: send_email_from_email_address
        in: query
        description: Optional specific email address to send from within the email account.
        required: false
        schema:
          type: string
      - name: sequence_no_email
        in: query
        description: Set to `true` if you want to add contacts to the sequence even if they do not have an email address.
        required: false
        schema:
          type: boolean
          default: false
      - name: sequence_unverified_email
        in: query
        description: Set to `true` if you want to add contacts to the sequence if they have an unverified email address.
        required: false
        schema:
          type: boolean
          default: false
      - name: sequence_job_change
        in: query
        description: Set to `true` if you want to add contacts to the sequence even if they have recently changed jobs.
        required: false
        schema:
          type: boolean
          default: false
      - name: sequence_active_in_other_campaigns
        in: query
        description: Set to `true` if you want to add contacts to the sequence even if they have been added to other sequences.
          This parameter does not differentiate between active and paused sequences.
        required: false
        schema:
          type: boolean
          default: false
      - name: sequence_finished_in_other_campaigns
        in: query
        description: Set to `true` if you want to add contacts to the sequence if they have been marked as `finished` in another
          sequence.
        required: false
        schema:
          type: boolean
          default: false
      - name: sequence_same_company_in_same_campaign
        in: query
        description: Set to `true` if you want to add contacts to the sequence even if other contacts from the same company
          are already in the sequence.
        required: false
        schema:
          type: boolean
          default: false
      - name: contacts_without_ownership_permission
        in: query
        description: Set to `true` if you want to add contacts even if you don't have ownership permission for them.
        required: false
        schema:
          type: boolean
          default: false
      - name: add_if_in_queue
        in: query
        description: Set to `true` if you want to add contacts even if they are currently in the queue for processing.
        required: false
        schema:
          type: boolean
          default: false
      - name: contact_verification_skipped
        in: query
        description: Set to `true` if you want to skip contact verification during the addition process.
        required: false
        schema:
          type: boolean
          default: false
      - name: user_id
        in: query
