        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Activate a Sequence endpoint to start an inactive sequence. Once activated, the sequence begins sending emails to
        its contacts on the configured schedule. The sequence must have at least one step configured before it can be activated.'
