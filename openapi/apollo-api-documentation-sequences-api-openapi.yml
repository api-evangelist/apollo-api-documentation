  /sequences/{id}:
    put:
      summary: Update a Sequence
      description: '## Endpoint essentials


        **API key access:** `api/v1/sequences/update` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_update`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Update a Sequence endpoint to update an existing sequence (emailer campaign) in your team''s Apollo account.<br><br>You
        can update sequence-level settings, such as the name, active state, schedule, and sending limits, as well as the sequence''s
        steps and the email touches within each step. <br><br>To turn a sequence on or off, set the `active` field. Passing
        `emailer_steps` will create, update, reorder, or remove steps and their touches based on the IDs you provide.<br><br>To
        create a new sequence instead, use the <a href="https://docs.apollo.io/reference/create-sequence">Create a Sequence
        endpoint</a>.


        ### Reassigning sequence ownership


        Unlike [Create a Sequence](https://docs.apollo.io/reference/create-sequence), this endpoint accepts `user_id` and
        uses it to change who owns the sequence. Pass the intended owner''s Apollo user ID, and the response reflects it in
        both `user_id` and its alias `object_owner_id`. Use [Get a List of Users](https://docs.apollo.io/reference/get-a-list-of-users)
        to look up IDs.


        This is how you correct ownership on sequences created with an API key, which aren''t owned by the teammate who created
        the key. See [Authentication](https://docs.apollo.io/reference/authentication) for how the acting user is resolved.'
      tags:
      - Sequences
      operationId: update-sequence
      parameters:
      - name: id
        in: path
        description: 'The Apollo ID for the sequence that you want to update. <br><br>To find sequence IDs, call the <a href="https://docs.apollo.io/reference/search-for-sequences"
          target="_blank">Search for Sequences endpoint</a> and identify the `id` value for the sequence. <br><br>Example:
          `66e34b81740c50074e3d1bd4`'
        schema:
          type: string
        required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Update the name of the sequence. Example: `New outbound sequence`'
                active:
                  type: boolean
                  description: Turn the sequence on (`true`) or off (`false`). When set to `true`, Apollo resumes scheduling
                    for the sequence; when set to `false`, pending work is paused.
                creation_type:
                  type: string
                  description: The creation type for the sequence. A `draft` sequence is automatically promoted to `new` (or
                    `ai_assistant`) when steps are added.
                  enum:
                  - draft
                  - new
                  - ai_assistant
                permissions:
                  type: string
                  deprecated: true
                  description: '**Deprecated.** This parameter is still accepted, but it no longer controls who can access
                    the sequence and it is no longer returned in any sequence response. Use `sharing_permission` instead.'
                sharing_permission:
                  type: object
                  description: Update who can access the sequence. This replaced the legacy `permissions` parameter. <br><br>Changing
                    `access_type` or any of the sharing access arrays requires a plan that includes sharing; `visibility`
                    can be updated on any plan.
                  properties:
                    visibility:
                      type: string
                      description: Set to `everyone` to share the sequence with your whole team, or `restricted` to limit
                        it to the owner and the users or teams listed in `sharing_accesses`. <br><br>Changing `visibility`
                        resets `access_type` to `can_view` when the new value is `everyone`, and to `null` when it is `restricted`.
                      enum:
                      - restricted
                      - everyone
                    access_type:
                      type: string
                      description: 'The level of access your team receives when `visibility` is `everyone`. Ignored when `visibility`
                        is `restricted`. <br><br>Choose 1 of the following options: <ul><li>`can_view`: Team members can view
                        the sequence.</li><li>`can_edit`: Team members can view and edit the sequence.</li><li>`full_access`:
                        Team members can view, edit, and share the sequence.</li></ul>'
                      enum:
                      - can_view
                      - can_edit
                      - full_access
                    added_sharing_accesses:
                      type: array
                      description: Share the sequence with specific users or teams, in addition to whatever `visibility` grants.
                        <br><br>Note that the response returns the current shares as a single `sharing_accesses` array; to
                        change them, use these `added_`, `updated_`, and `deleted_` arrays instead. <br><br>If an entry sets
                        `user_or_team_type` to `team`, its `access_type` also overrides the `access_type` you pass at the
                        top level of `sharing_permission`.
                      items:
                        type: object
                        properties:
                          user_or_team_id:
                            type: string
                            description: The Apollo ID for the user or team to share the sequence with.
                          user_or_team_type:
                            type: string
                            description: Whether `user_or_team_id` refers to an individual user, a team, or a subteam.
                            enum:
                            - user
                            - team
                            - subteam
                          access_type:
                            type: string
                            description: The level of access to grant.
                            enum:
                            - can_view
                            - can_edit
                            - full_access
                    updated_sharing_accesses:
                      type: array
                      description: Change the access level of users or teams the sequence is already shared with. Entries
                        are matched on `user_or_team_id`; an entry for the sequence owner is ignored.
                      items:
                        type: object
                        properties:
                          user_or_team_id:
                            type: string
                            description: The Apollo ID for the user or team whose access you want to change.
                          access_type:
                            type: string
                            description: The new level of access.
                            enum:
                            - can_view
                            - can_edit
                            - full_access
                    deleted_sharing_accesses:
                      type: array
                      description: Stop sharing the sequence with specific users or teams. Entries are matched on `user_or_team_id`;
                        an entry for the sequence owner is ignored.
                      items:
                        type: object
                        properties:
                          user_or_team_id:
                            type: string
                            description: The Apollo ID for the user or team to remove access from.
                user_id:
                  type: string
                  description: 'Reassign the sequence to a different owner. Pass the Apollo user ID of the intended owner;
                    the response returns it as `user_id` and its alias `object_owner_id`. <br><br>Use this to correct ownership
                    on sequences created with an API key, which aren''t owned by the teammate who created the key (see <a
                    href="https://docs.apollo.io/reference/authentication">Authentication</a>). <a href="https://docs.apollo.io/reference/create-sequence">Create
                    a Sequence</a> ignores `user_id`, so reassignment happens here. <br><br>Use the <a href="https://docs.apollo.io/reference/get-a-list-of-users">Get
                    a List of Users endpoint</a> to retrieve IDs for the users in your workspace. Example: `66302798d03b9601c7934ebf`'
                emailer_schedule_id:
                  type: string
                  description: 'Attach a sending schedule to the sequence. Must reference a non-empty schedule that belongs
                    to your team. Example: `6095a710bd01d100a506d4af`'
                label_names:
                  type: array
                  description: Replace the labels (folders) this sequence belongs to. Passing new values will overwrite the
                    existing labels.
                  items:
                    type: string
                max_emails_per_day:
                  type: integer
                  description: Maximum number of emails that can be sent per day for this sequence.
                same_account_reply_delay_days:
                  type: integer
                  description: Number of days to wait before contacting another person at the same account.
                cc_emails:
                  type: string
                  description: Comma-separated list of email addresses to CC on emails sent from this sequence.
                bcc_emails:
                  type: string
                  description: Comma-separated list of email addresses to BCC on emails sent from this sequence.
                emailer_steps:
                  type: array
                  description: The ordered list of steps in the sequence. Include an `id` to update an existing step; omit
                    it to create a new step. Steps that exist on the sequence but are not present in this array are removed.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The Apollo ID of an existing step to update. Omit to create a new step.
                      position:
                        type: integer
                        description: 'The 1-based position of the step within the sequence. Example: `1`'
                      type:
                        type: string
                        description: The step type.
                        example: auto_email
                      wait_mode:
                        type: string
                        description: 'The unit used for the wait before this step runs. Example: `day`'
                      wait_time:
                        type: integer
                        description: 'How long to wait (in `wait_mode` units) before running this step. Example: `1`'
                      auto_skip_in_x_days:
                        type: integer
                        description: Automatically skip this step if it has not run within the given number of days.
                      emailer_touches:
                        type: array
                        description: The email touches that belong to this step. Include an `id` to update an existing touch;
                          omit it to create a new touch.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The Apollo ID of an existing touch to update. Omit to create a new touch.
                            status:
                              type: string
                              description: The review status of the touch. Set to `approved` to enable the touch (the template
                                must have a non-empty body).
                              enum:
                              - to_be_reviewed
                              - approved
                            attachment_ids:
                              type: array
                              description: IDs of attachments to include with this touch.
                              items:
                                type: string
                            emailer_template:
                              type: object
                              description: The email template content for this touch.
                              properties:
                                subject:
                                  type: string
                                  description: 'The subject line of the email. Example: `Quick question, {{first_name}}`'
                                body_html:
                                  type: string
                                  description: 'The HTML body of the email. Example: `<p>Hi {{first_name}}</p>`'
                            generation_options:
                              type: array
                              description: AI generation options used to compose the touch content.
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: ai_full_email
                                  additional_prompt:
                                    type: string
                                  signals:
                                    type: array
                                    items:
                                      type: string
                                  field_name:
                                    type: string
                                    example: AI Full Email df7fdbd8
                            generation_tone:
                              type: object
                              description: The tone to apply when generating the touch content with AI.
                              properties:
                                tone_type:
                                  type: string
                                  example: Direct
                                tone_sample:
                                  type: string
            examples:
              Rename a sequence:
                summary: Update sequence-level settings
                value:
                  name: Q3 Outbound Outreach (revised)
                  max_emails_per_day: 50
              Reassign the sequence owner:
                summary: Hand a sequence created with an API key to a specific user
                value:
                  user_id: 66302798d03b9601c7934ebf
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 66e34b81740c50074e3d1bd4
