  /emailer_campaigns/{sequence_id}/abort:
    post:
      summary: Deactivate a Sequence
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_campaigns/abort` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_abort`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Deactivate a Sequence endpoint to stop an active sequence. Once deactivated, the sequence pauses all contacts and
        stops sending emails.'
      tags:
      - Sequences
      operationId: abort-sequence
      parameters:
      - name: sequence_id
        in: path
        description: 'The Apollo ID for the sequence that you want to deactivate. <br><br>To find sequence IDs, call the <a
          href="https://docs.apollo.io/reference/search-for-sequences" target="_blank">Search for Sequences endpoint</a> and
          identify the <code>id</code> value for the sequence. <br><br>Example: <code>66e9e215ece19801b219997f</code>'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
