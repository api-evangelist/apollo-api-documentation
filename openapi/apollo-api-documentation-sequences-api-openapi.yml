  /emailer_campaigns/remove_or_stop_contact_ids:
    post:
      summary: Update Contact Status in a Sequence
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_campaigns/remove_or_stop_contact_ids` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_remove_or_stop_contact_ids`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Update Contact Status in a Sequence endpoint to either mark contacts as having `finished` a sequence, or to remove
        them from a sequence entirely.'
      tags:
      - Sequences
      operationId: update-contact-status-sequence
      parameters:
      - name: emailer_campaign_ids[]
        in: query
        description: 'The Apollo IDs for the sequences that you want to update. If you add multiple sequences, you will update
          the status of the contacts across the chosen sequences. <br><br>To find sequence IDs, call the <a href="https://docs.apollo.io/reference/search-for-sequences"
          target="_blank">Search for Sequences endpoint</a> and identify the `id` value for the sequence. <br><br>Example:
