  /sequences:
    post:
      summary: Create a Sequence
      description: '## Endpoint essentials


        **API key access:** `api/v1/sequences/create` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Create a Sequence endpoint to create a new sequence in your team''s Apollo account, including its steps and email
        templates.<br><br>To create a sequence with steps, add the `emailer_steps` array to the request body. Each email step
        (`auto_email`, `manual_email`) can include one or more `emailer_touches` (email variants); adding more than one touch
        to a step creates an A/B test, which requires a plan with A/B testing access.<br><br>To activate the sequence immediately
        after creation, set `active` to `true`. Email touches only send if their `status` is `approved`, and a touch can only
        be approved if its template has a non-empty body.


        ### Who owns a sequence created via API


        The new sequence is owned by the user your request acts as, returned as `object_owner_id` (and its alias, `user_id`).
        With an API key that user isn''t the teammate who created the key, so expect `object_owner_id` to differ from that
        teammate''s profile — see [Authentication](https://docs.apollo.io/reference/authentication) for how the acting user
        is resolved and how to confirm it.


        This endpoint ignores `user_id` in the request body, so you can''t choose the owner at creation time. To reassign
        ownership afterward, call [Update a Sequence](https://docs.apollo.io/reference/update-sequence) with a `user_id`.'
      tags:
      - Sequences
      operationId: create-sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'A human-readable name for the sequence. <br><br>Example: `Q3 Outbound Outreach`'
                permissions:
                  type: string
                  deprecated: true
                  description: '**Deprecated.** This parameter is still accepted, but it no longer controls who can access
                    the sequence and it is no longer returned in any sequence response. <br><br>New sequences are created
                    with restricted visibility, so only the owner can access the sequence until it is shared. To share it,
                    call the <a href="https://docs.apollo.io/reference/update-sequence">Update a Sequence endpoint</a> with
                    the `sharing_permission` object.'
                active:
                  type: boolean
                  description: Set to `true` to activate the sequence immediately after creation so contacts added to it start
                    receiving steps. If omitted or `false`, the sequence is created in an inactive state.
                emailer_schedule_id:
                  type: string
                  description: The Apollo ID for the schedule that controls the days and times emails are sent. The schedule
                    must belong to your team and must not be empty.
                user_id:
                  type: string
                  description: Ignored by this endpoint. The new sequence is always owned by the user your request acts as,
                    returned as `object_owner_id` (alias `user_id`) — see <a href="https://docs.apollo.io/reference/authentication">Authentication</a>
                    for which user that is. <br><br>To assign a different owner, create the sequence and then call the <a
                    href="https://docs.apollo.io/reference/update-sequence">Update a Sequence endpoint</a> with the `user_id`
                    you want.
                label_names:
                  type: array
                  items:
                    type: string
                  description: 'Add the names of lists (labels) to apply to the sequence. Labels that do not exist yet are
                    created. <br><br>Example: `["Outbound", "Q3"]`'
                folder_id:
                  type: string
                  description: The Apollo ID for the folder in which to place the sequence.
                sequence_by_exact_daytime:
                  type: boolean
                  description: Set to `true` to schedule every step at an exact date and time (`exact_datetime` becomes required
                    on each step) instead of using relative wait intervals (`wait_time`/`wait_mode`).
                max_emails_per_day:
                  type: integer
                  description: The maximum number of emails the sequence sends per day. Must not be negative.
                mark_finished_if_reply:
                  type: boolean
                  description: Set to `true` to mark contacts as finished in the sequence when they reply to an email.
                mark_finished_if_click:
                  type: boolean
                  description: Set to `true` to mark contacts as finished in the sequence when they click a link in an email.
                mark_finished_if_interested:
                  type: boolean
                  description: Set to `true` to mark contacts as finished in the sequence when they are marked as interested.
                mark_paused_if_ooo:
                  type: boolean
                  description: Set to `true` to pause contacts in the sequence when an out-of-office auto-reply is detected.
                days_to_wait_before_mark_as_response:
                  type: integer
                  description: The number of days to wait before an incoming email is no longer treated as a response to the
                    sequence.
                create_task_if_email_open:
                  type: boolean
                  description: Set to `true` to automatically create a task when a contact opens an email a certain number
                    of times. Use `email_open_trigger_task_threshold` to set the number of opens.
                email_open_trigger_task_threshold:
                  type: integer
                  description: The number of email opens that triggers task creation when `create_task_if_email_open` is `true`.
                same_account_reply_delay_days:
                  type: integer
                  description: The number of days to pause other contacts at the same account after a reply is received. The
                    maximum value is `1000`.
                excluded_account_stage_ids:
                  type: array
                  items:
                    type: string
                  description: The Apollo IDs for account stages to exclude from the sequence. All IDs must belong to your
                    team.
                excluded_contact_stage_ids:
                  type: array
                  items:
                    type: string
                  description: The Apollo IDs for contact stages to exclude from the sequence. All IDs must belong to your
                    team.
                ignore_apollo_global_email_bounce_list:
                  type: boolean
                  description: Set to `true` to send emails to contacts even if their email address is on Apollo's global
                    bounce list.
                sequence_ruleset_id:
                  type: string
                  description: The Apollo ID for an existing sequence ruleset to apply shared sequence settings.
                emailer_steps:
                  type: array
                  description: The steps to create in the sequence. Steps run in the order they appear in this array; the
                    first item becomes the first step. There is no separate ordering field on input.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: 'The type of step. Choose 1 of the following options: <ul><li>`auto_email`: An email
                          that Apollo sends automatically.</li><li>`manual_email`: An email task that a user sends manually.</li><li>`call`:
                          A phone call task.</li><li>`action_item`: A general to-do task.</li><li>`linkedin_step_connect`:
                          A LinkedIn connection request task.</li><li>`linkedin_step_message`: A LinkedIn message task.</li><li>`linkedin_step_view_profile`:
                          A LinkedIn profile view task.</li><li>`linkedin_step_interact_post`: A LinkedIn post interaction
                          task.</li></ul>Step types other than `auto_email` require a plan with access to basic task functions.'
                      wait_time:
                        type: integer
                        description: 'How long to wait after the previous step before this step runs. Required (along with
                          `wait_mode`) unless the sequence uses `sequence_by_exact_daytime`. <br><br>Example: `2`'
                      wait_mode:
                        type: string
                        description: 'The unit for `wait_time`. Choose 1 of the following options: `minute`, `hour`, `day`.'
                      exact_datetime:
                        type: string
                        description: The exact date and time at which the step runs, in ISO 8601 format. Required for each
                          step when `sequence_by_exact_daytime` is `true`; must be in the future and later than the datetimes
                          of all previous steps.
                      priority:
                        type: string
                        description: 'The priority of the task created for the step. Choose 1 of the following options: `high`,
                          `medium`, `low`. Not applicable to `auto_email` steps.'
                      note:
                        type: string
                        description: A note describing the step (for example, call talking points or action item instructions).
                      max_emails_per_day:
                        type: integer
                        description: The maximum number of emails to send per day for this step.
                      auto_skip_in_x_days:
                        type: integer
                        description: Automatically skip the task for this step if it is not completed within the given number
                          of days.
                      emailer_touches:
                        type: array
                        description: The email variants for the step. Applies to `auto_email`, `manual_email`, `linkedin_step_message`,
                          `linkedin_step_connect`, and `call` steps. Adding more than 1 touch to a step creates an A/B test,
                          which requires a plan with A/B testing access.
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: 'How the email threads with earlier steps. Choose 1 of the following options: <ul><li>`new_thread`:
                                Start a new email thread.</li><li>`reply_to_thread`: Reply to the thread started by a previous
                                step. A `reply_to_thread` touch must come after a step that starts a new thread.</li></ul>'
                            status:
                              type: string
                              description: 'The review status of the touch. Choose 1 of the following options: <ul><li>`approved`:
                                The touch is approved and will be sent. Requires a template with a non-empty body.</li><li>`to_be_reviewed`:
                                The touch requires review before it sends. (default)</li></ul>'
                            include_signature:
                              type: boolean
                              description: Set to `true` to append the sending user's email signature to the email.
                            emailer_template:
                              type: object
                              description: The email content for the touch. Provide `id` to update an existing template that
                                your team owns, or omit `id` to create a new template.
                              properties:
                                id:
                                  type: string
                                  description: The Apollo ID for an existing email template to use and update.
                                subject:
                                  type: string
                                  description: The subject line for the email. Supports dynamic variables such as `{{first_name}}`.
                                    Leave empty on a `reply_to_thread` touch to reuse the thread's subject.
                                body_html:
                                  type: string
                                  description: The HTML body for the email. Supports dynamic variables such as `{{first_name}}`.
                                    The HTML is sanitized; unsafe tags and attributes are removed.
                            attachment_ids:
                              type: array
                              items:
                                type: string
                              description: The Apollo IDs for attachments to include with the email.
            examples:
              Create and activate a 2-step sequence:
                value:
                  name: Q3 Outbound Outreach
                  active: true
                  emailer_schedule_id: 66e9e215ece19801b2199900
                  label_names:
                  - Outbound
                  emailer_steps:
                  - type: auto_email
                    wait_time: 0
                    wait_mode: minute
                    emailer_touches:
                    - type: new_thread
                      status: approved
                      include_signature: true
                      emailer_template:
                        subject: Quick question, {{first_name}}
                        body_html: <p>Hi {{first_name}},</p><p>I noticed {{company}} is growing quickly...</p>
                  - type: auto_email
                    wait_time: 3
                    wait_mode: day
                    emailer_touches:
                    - type: reply_to_thread
                      status: approved
                      include_signature: true
                      emailer_template:
                        subject: ''
                        body_html: <p>Hi {{first_name}}, just floating this back to the top of your inbox.</p>
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK:
                  value:
                    emailer_campaign:
                      id: 68b1f3a2e1d2c40001a23b45
