      parameters:
      - name: emailer_message_stats[]
        in: query
        required: false
        description: 'Find emails based on their current status, such as whether they were delivered or opened. You can add
          multiple statuses. <br><br>Possible values include: <ul> <li> `delivered` </li> <li> `scheduled` </li> <li> `drafted`
          </li> <li> `not_opened` </li> <li> `opened` </li> <li> `clicked` </li> <li> `unsubscribed` </li> <li> `demoed` </li>
          <li> `bounced` </li> <li> `spam_blocked` </li> <li> `failed_other` </li> </ul>'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: emailer_message_reply_classes[]
        in: query
        required: false
        description: 'Find emails based on the response sentiment of the recipient. This can include the recipient expressing
          interest in meeting or having a follow-up question. You can add multiple values.<br><br>Possible values include:
          <ul> <li> `willing_to_meet` </li> <li> `follow_up_question` </li> <li> `person_referral` </li> <li> `out_of_office`
          </li> <li> `already_left_company_or_not_right_person` </li> <li> `not_interested` </li> <li> `unsubscribe` </li>
          <li> `none_of_the_above` </li> </ul>'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: user_ids[]
        in: query
        required: false
        description: 'Find emails sent by specific users in your team''s Apollo account. You can add multiple users. <br><br>Use
          the <a href="https://docs.apollo.io/reference/get-a-list-of-users" target="_blank">Get a List of Users endpoint</a>
          to retrieve IDs for all of the users within your Apollo account. <br><br>Example: `66302798d03b9601c7934ebf`'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: email_account_id_and_aliases
        in: query
        required: false
        description: ''
        schema:
          type: string
          default: ''
      - name: emailer_campaign_ids[]
        in: query
        required: false
        description: 'Search for emails that are included in specific sequences in your Apollo account. You can search multiple
          sequences. Any sequence not included in this parameter will be exclude from search results.<br><br>To find sequence
          IDs, call the <a href="https://docs.apollo.io/reference/search-for-sequences" target="_blank">Search for Sequences
          endpoint</a> and identify the `id` value for the sequence. <br><br>Example: `66e9e215ece19801b219997f`'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: not_emailer_campaign_ids[]
        in: query
        required: false
        description: 'Exclude emails from specific sequences in your Apollo account. You can exclude multiple sequences. Any
          sequence not excluded using this parameter will be included in search results.<br><br>To find sequence IDs, call
          the <a href="https://docs.apollo.io/reference/search-for-sequences" target="_blank">Search for Sequences endpoint</a>
          and identify the `id` value for the sequence. <br><br>Example: `66e9e215ece19801b219997f`'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: emailer_message_date_range_mode
        in: query
        required: false
        description: 'Use this parameter in combination with the `emailer_message_date_range[max]` and `emailer_message_date_range[min]`
          parameters. Find emails based on 1 of the following options: <ul> <li> `due_at`: When emails are scheduled to be
          delivered. </li> <li> `completed_at`: When emails were delivered. </li> </ul>'
        schema:
          type: string
          default: ''
      - name: emailer_message_date_range[max]
        in: query
        required: false
        description: 'Set the upper bound of the date range you want to search. <br><br>Use this parameter in combination
          with the `emailer_message_date_range[min]` and `emailer_message_date_range_mode` parameters. This date should fall
          after the `emailer_message_date_range[min]` date. <br><br>The date should be formatted as `YYYY-MM-DD`. <br><br>Example:
          `2025-10-30`'
        schema:
          type: string
          format: date
          default: ''
      - name: emailer_message_date_range[min]
        in: query
        required: false
        description: 'Set the lower bound of the date range you want to search. <br><br>Use this parameter in combination
          with the `emailer_message_date_range[max]` and `emailer_message_date_range_mode` parameters. This date should fall
          before the `emailer_message_date_range[max]` date. <br><br>The date should be formatted as `YYYY-MM-DD`. <br><br>Example:
          `2025-10-30`'
        schema:
          type: string
          format: date
          default: ''
      - name: not_sent_reason_cds[]
        in: query
        required: false
        description: 'Find emails based on the reason they were not sent. You can add multiple values.<br><br>Possible values
          include: <ul> <li> `contact_stage_safeguard` </li> <li> `same_account_reply` </li> <li> `account_stage_safeguard`
          </li> <li> `email_unverified` </li> <li> `snippets_missing` </li> <li> `personalized_opener_missing` </li> <li>
          `thread_reply_original_email_missing` </li> <li> `no_active_email_account` </li> <li> `email_format_invalid` </li>
          <li> `ownership_permission` </li> <li> `email_service_provider_delivery_failure` </li> <li> `sendgrid_dropped_email`
          </li> <li> `mailgun_dropped_email` </li> <li> `gdpr_compliance` </li> <li> `not_valid_hard_bounce_detected` <li>
          `other_safeguard` </li> <li> `new_job_change_detected` </li> <li> `email_on_global_bounce_list` </li> </ul>'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: q_keywords
        in: query
        required: false
        description: 'Add keywords to narrow the search of the emails in your team''s Apollo account. <br><br>Keywords should
          directly match at least part of an email''s content. For example, searching the keyword `James` might return emails
          that were sent by `James Smith`. <br><br>Example: `Jane`'
        schema:
          type: string
          default: ''
      - name: page
        in: query
        description: 'The page number of the Apollo data that you want to retrieve. <br><br>Use this parameter in combination
          with the `per_page` parameter to make search results for navigable and improve the performance of the endpoint.
          <br><br>Example: `4`'
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        description: 'The number of search results that should be returned for each page. Limiting the number of results per
          page improves the endpoint''s performance. <br><br>Use the `page` parameter to search the different pages of data.
          <br><br>Example: `10`'
        schema:
          type: integer
          format: int32
  /emailer_campaigns/activity_feed:
    post:
      summary: Get Contact Sequence Activity
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_campaigns/activity_feed` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_activity_feed`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Get Contact Sequence Activity endpoint to retrieve one contact''s sequence timeline: when they were added to a sequence,
        when their enrollment was paused, resumed, failed, finished, or removed, and when they replied. This is the same enrollment
        activity that the contact''s timeline shows in Apollo.<br><br>You must provide a `contact_id`, and that contact must
        belong to your team. This endpoint returns activity for a single contact — it doesn''t return activity for every contact
        in a sequence. To narrow the timeline to one sequence, also provide a `sequence_id`.<br><br>Events are returned newest-first,
        and each response contains at most 50 events. There is no `page` parameter: the endpoint always returns the most recent
        events, so use `per_page` to request fewer than 50.<br><br>To find contact IDs, call the <a href="https://docs.apollo.io/reference/search-for-contacts">Search
        for Contacts endpoint</a> and identify the `id` value for the contact. To find sequence IDs, call the <a href="https://docs.apollo.io/reference/search-for-sequences">Search
        for Sequences endpoint</a> and identify the `id` value for the sequence.'
      tags:
      - Sequences
      operationId: get-contact-sequence-activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contact_id
              properties:
                contact_id:
                  type: string
                  description: 'The Apollo ID for the contact whose sequence activity you want to retrieve. The contact must
                    belong to your team, otherwise a `404` is returned. <br><br>To find contact IDs, call the <a href="https://docs.apollo.io/reference/search-for-contacts">Search
                    for Contacts endpoint</a> and identify the `id` value for the contact. <br><br>Example: `66e34b81740c50074e3d1bd4`'
                sequence_id:
                  type: string
                  description: 'The Apollo ID for a single sequence. When provided, only events from that sequence are returned.
                    When omitted, events from all of the contact''s sequences are returned. <br><br>If the ID doesn''t match
                    a sequence with activity for this contact, an empty `events` array is returned instead of an error. <br><br>To
                    find sequence IDs, call the <a href="https://docs.apollo.io/reference/search-for-sequences">Search for
                    Sequences endpoint</a> and identify the `id` value for the sequence. <br><br>Example: `66e9e215ece19801b219997f`'
                per_page:
                  type: integer
                  description: 'The maximum number of events to return, from 1 to 50. Defaults to `50` when omitted. <br><br>Values
                    above 50 are reduced to 50, and values below 1 — including `0`, negative numbers, and values that aren''t
                    numbers — are raised to 1. <br><br>This isn''t a pagination parameter and there is no `page` parameter:
                    the endpoint always returns the most recent events, so lowering `per_page` returns a shorter, more recent
                    timeline rather than a different page of results. <br><br>Example: `25`'
                  default: 50
                  minimum: 1
                  maximum: 50
            examples:
              All sequence activity for a contact:
                value:
                  contact_id: 66e34b81740c50074e3d1bd4
              Activity for one sequence:
                value:
                  contact_id: 66e34b81740c50074e3d1bd4
                  sequence_id: 66e9e215ece19801b219997f
                  per_page: 25
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                OK:
                  value:
                    contact_id: 66e34b81740c50074e3d1bd4
                    events:
                    - type: removed
                      occurred_at: '2026-07-28T10:26:55Z'
                      sequence_id: 66e9e215ece19801b219997f
                      sequence_name: Q2 Outreach
                    - type: completed
                      occurred_at: '2026-07-27T10:26:55Z'
                      sequence_id: 66e9e215ece19801b219997f
                      sequence_name: Q2 Outreach
                    - type: replied
                      occurred_at: '2026-07-26T10:26:55Z'
                      sequence_id: 66e9e215ece19801b219997f
                      sequence_name: Q2 Outreach
                      emailer_message_id: 66e8cc45028aed019c25d724
                    - type: paused
                      occurred_at: '2026-07-22T10:26:55Z'
                      sequence_id: 66e9e215ece19801b219997f
                      sequence_name: Q2 Outreach
                      reason: manually paused
                    - type: enrolled
                      occurred_at: '2026-07-20T10:26:55Z'
                      sequence_id: 66e9e215ece19801b219997f
                      sequence_name: Q2 Outreach
                      step_position: 2
                No sequence activity:
                  value:
                    contact_id: 66e34b81740c50074e3d1bd4
                    events: []
              schema:
                type: object
                properties:
                  contact_id:
                    type: string
                    description: The Apollo ID of the contact whose activity was returned.
                  events:
                    type: array
                    description: The contact's sequence events, ordered newest-first. Contains at most 50 events, or at most
                      `per_page` events when `per_page` is provided. Fields that don't apply to an event are omitted rather
                      than returned as `null`.
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 'What happened. <ul> <li> `enrolled`: the contact was added to the sequence. </li>
                            <li> `paused`: the contact''s enrollment was paused. </li> <li> `resumed`: the contact''s enrollment
                            was resumed after being paused. </li> <li> `failed`: the contact''s enrollment failed. </li> <li>
                            `completed`: the contact finished the sequence. </li> <li> `removed`: the contact was removed
                            from the sequence. </li> <li> `replied`: the contact replied to an email from the sequence. </li>
                            </ul>'
                          enum:
                          - enrolled
                          - paused
                          - resumed
                          - failed
                          - completed
                          - removed
                          - replied
                        occurred_at:
                          type: string
                          description: The ISO 8601 timestamp for when the event happened. Events with no recorded timestamp
                            aren't returned.
                        sequence_id:
                          type: string
                          description: The Apollo ID of the sequence the event belongs to. Omitted if the event isn't linked
                            to a sequence.
                        sequence_name:
                          type: string
                          description: The name of the sequence the event belongs to. This key is omitted, never `null`, if
                            the event isn't linked to a sequence or the sequence no longer exists.
                        step_position:
                          type: integer
                          description: The position of the sequence step the event relates to. Only returned for enrollment-lifecycle
                            events that are linked to a specific step. This key is omitted, never `null`, when it doesn't
                            apply.
                        reason:
                          type: string
                          description: Why the enrollment was paused. Only returned for `paused` events, and only when Apollo
                            recorded a reason.
                          example: manually paused
                        emailer_message_id:
                          type: string
                          description: The Apollo ID of the email that the contact replied to. Only returned for `replied`
                            events. Pass this to the <a href="https://docs.apollo.io/reference/get-email-content">Get Email
                            Content endpoint</a> to read the original email.
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Endpoint not in API key scope:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/emailer_campaigns/activity_feed.\
                    \ Request an API key from your administrator that includes this endpoint in its configured scope.\",\n\
                    \  \"error_code\": \"API_INACCESSIBLE\"\n}"
              schema:
                title: Endpoint not in API key scope
                type: object
                properties:
                  error:
                    type: string
                    example: This API key is not authorized to access api/v1/emailer_campaigns/activity_feed. Request an API
                      key from your administrator that includes this endpoint in its configured scope.
                  error_code:
                    type: string
                    example: API_INACCESSIBLE
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Contact not found:
                  value: '{"error": "Contact not found"}'
              schema:
                title: Contact not found
                type: object
                properties:
                  error:
                    type: string
                    example: Contact not found
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n    \"message\": \"The maximum number of api calls allowed for api/v1/emailer_campaigns/activity_feed\
                    \ is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\
                    \n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/emailer_campaigns/activity_feed is 600 times
                      per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
