openapi: 3.1.0
info:
  title: Apollo API — Sequences
  summary: Programmatic access to Apollo's sales intelligence and engagement platform — data enrichment, prospect and company
    search, and go-to-market workflow management.
  description: 'The Apollo API provides programmatic access to [Apollo](https://www.apollo.io/), the all-in-one sales intelligence
    and engagement platform. Use it to enrich people and company data (individually or in bulk), search Apollo''s database
    of over 240 million contacts and 30 million companies, and manage accounts, contacts, deals, sequences, tasks, calls,
    and conversations in your go-to-market workflows.


    ## Base URL


    All API requests are made to `https://api.apollo.io/api/v1`.


    ## Authentication


    - **Apollo users** authenticate with an API key passed in the `x-api-key` request header. See [Create API Keys](https://docs.apollo.io/docs/create-api-key).

    - **Apollo partners** building integrations on behalf of mutual users authenticate with the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).


    ## Rate limits & credits


    Rate limits and credit consumption depend on your [Apollo pricing plan](https://docs.apollo.io/docs/api-pricing). Check
    your current limits and usage with the [View API Usage Stats and Rate Limits](https://docs.apollo.io/reference/view-api-usage-stats)
    endpoint. For more details, see [Rate Limits](https://docs.apollo.io/reference/rate-limits) and the [API FAQs](https://docs.apollo.io/docs/apollo-api-faqs).


    New to the API? Start with the [Apollo API overview](https://docs.apollo.io/reference/apollo-api).'
  termsOfService: https://www.apollo.io/terms/api
  contact:
    name: Apollo API Support
    url: https://docs.apollo.io/
  version: '1.0'
servers:
- url: https://api.apollo.io/api/v1
tags:
- name: Sequences
  description: Manage outreach sequences and the contacts enrolled in them.
security:
- apiKey: []
- bearerAuth: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: '[Recommended] API key, passed in the `x-api-key` request header.

        See [Create API Keys](https://docs.apollo.io/docs/create-api-key).'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 access token, used by Apollo partners building integrations.

        See the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).'
paths:
  /emailer_schedules:
    get:
      summary: List Email Schedules
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_schedules/index` or `Master API key`


        **OAuth scopes:** `emailer_schedules_list`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409477927309-Configure-a-Sequence-Sending-Schedule" target="_blank">Sending
        schedules</a> control the days and times that Apollo sends emails for your sequences. You can configure multiple sending
        schedules for different sequences, for example to match your audience''s time zone or when your contacts are most
        likely to engage.<br><br>Use the List Email Schedules endpoint to retrieve every sending schedule that has been created
        for your team''s Apollo account. For each schedule, the response returns its ID, name, time zone, weekly sending windows,
        and whether it is your team''s default schedule.<br><br>Use a schedule''s `id` as the `emailer_schedule_id` when you
        <a href="https://docs.apollo.io/reference/create-sequence" target="_blank">create a sequence</a> or <a href="https://docs.apollo.io/reference/update-sequence"
        target="_blank">update a sequence</a> to control when that sequence''s emails are sent.'
      tags:
      - Sequences
      operationId: list-email-schedules
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"emailer_schedules\": [\n    {\n      \"id\": \"6605a1f2e4b0c80012a3d456\",\n      \"name\"\
                    : \"Normal Business Hours\",\n      \"default\": true,\n      \"time_zone\": \"America/Los_Angeles\",\n\
                    \      \"schedule_hash\": {\n        \"monday\": [[8, 17]],\n        \"tuesday\": [[8, 17]],\n       \
                    \ \"wednesday\": [[8, 17]],\n        \"thursday\": [[8, 17]],\n        \"friday\": [[8, 17]]\n      },\n\
                    \      \"created_at\": \"2024-03-28T18:56:24.067Z\",\n      \"use_contacts_time_zone\": true,\n      \"\
                    skip_holidays\": true\n    },\n    {\n      \"id\": \"6605a2b7e4b0c80012a3d789\",\n      \"name\": \"\
                    West Coast Afternoons\",\n      \"default\": false,\n      \"time_zone\": \"America/New_York\",\n    \
                    \  \"schedule_hash\": {\n        \"monday\": [[12, 17]],\n        \"wednesday\": [[12, 17]],\n       \
                    \ \"friday\": [[12, 17]]\n      },\n      \"created_at\": \"2024-04-02T14:10:05.512Z\",\n      \"use_contacts_time_zone\"\
                    : false,\n      \"skip_holidays\": true\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  emailer_schedules:
                    type: array
                    description: The list of sending schedules that belong to your team.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique Apollo ID for the sending schedule. Use this value as the `emailer_schedule_id`
                            when you create or update a sequence.
                          example: 6605a1f2e4b0c80012a3d456
                        name:
                          type: string
                          description: The name of the sending schedule.
                          example: Normal Business Hours
                        default:
                          type: boolean
                          description: Whether this is the default sending schedule for your team. Only one schedule can be
                            the default at a time.
                          example: true
                        time_zone:
                          type: string
                          description: The IANA time zone that the schedule's sending windows are defined in, for example
                            `America/Los_Angeles`.
                          example: America/Los_Angeles
                        schedule_hash:
                          type: object
                          description: The weekly sending windows, keyed by day of the week. Each day maps to an array of
                            `[start_hour, end_hour]` pairs using 24-hour times, so `[[8, 17]]` means 8:00 AM to 5:00 PM. Days
                            with no sending windows are omitted.
                        created_at:
                          type: string
                          description: The timestamp for when the schedule was created, in ISO 8601 format.
                          example: '2024-03-28T18:56:24.067Z'
                        use_contacts_time_zone:
                          type: boolean
                          description: Whether Apollo sends emails according to each contact's own time zone instead of the
                            schedule's `time_zone`.
                          example: true
                        skip_holidays:
                          type: boolean
                          description: Whether Apollo skips sending emails on holidays.
                          example: true
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Need master API key:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/emailer_schedules/index. Request\
                    \ an API key from your administrator that includes this endpoint in its configured scope.\",\n  \"error_code\"\
                    : \"API_INACCESSIBLE\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This API key is not authorized to access api/v1/emailer_schedules/index. Request an API key from
                      your administrator that includes this endpoint in its configured scope.
                  error_code:
                    type: string
                    example: API_INACCESSIBLE
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n    \"message\": \"The maximum number of api calls allowed for api/v1/emailer_schedules is 600\
                    \ times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/emailer_schedules is 600 times per hour. Please
                      upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
  /emailer_campaigns/search:
    post:
      summary: Search for Sequences
      description: '## Endpoint essentials


        **API key access:** `api/v1/emailer_campaigns/search` or `Master API key`


        **OAuth scopes:** `emailer_campaigns_search`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4409237165837-Sequences-Overview" target="_blank">Sequences</a>
        are outreach campaigns that sales teams use to reach out to contacts over a planned period of time.<br><br>Use the
        Search for Sequences endpoint to search for the sequences that have been created for your team''s Apollo account.'
      tags:
      - Sequences
      operationId: search-for-sequences
      parameters:
      - name: q_name
        in: query
        description: 'Add keywords to narrow the search of the sequences in your team''s Apollo account. <br><br>Keywords
          should directly match at least part of a sequence''s name. For example, searching the keyword `marketing` might
          return the result `NY Marketing Sequence`, but not `NY Marketer Conference 2025 attendees`. <br><br>This parameter
          only searches sequence names, not other sequence fields. <br><br>Example: `marketing conference attendees`'
        schema:
          type: string
      - name: page
        in: query
        description: 'The page number of the Apollo data that you want to retrieve. <br><br>Use this parameter in combination
          with the `per_page` parameter to make search results for navigable and improve the performance of the endpoint.
          <br><br>Example: `4`'
        schema:
          type: string
      - name: per_page
        in: query
        description: 'The number of search results that should be returned for each page. Limiting the number of results per
          page improves the endpoint''s performance. <br><br>Use the `page` parameter to search the different pages of data.
          <br><br>Example: `10`'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    pagination:
                      page: 1
                      per_page: 5
