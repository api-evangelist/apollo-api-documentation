          contacts to a sequence. When the sequence is updated, the activity log shows the user that added the contacts. <br><br>Use
          the <a href="https://docs.apollo.io/reference/get-a-list-of-users" target="_blank">Get a List of Users endpoint</a>
          to retrieve IDs for all of the users within your Apollo account. <br><br>Example: `66302798d03b9601c7934ebf`'
        required: false
        schema:
          type: string
