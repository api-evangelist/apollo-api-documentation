      parameters:
      - name: logged
        in: query
        required: false
        description: Set to `true` if you want to create an individual record for the phone call in Apollo.
        schema:
          type: boolean
          default: ''
      - name: user_id[]
        in: query
        required: false
        description: 'Designate the caller in your team''s Apollo account. <br><br>Use the <a href="https://docs.apollo.io/reference/get-a-list-of-users"
          target="_blank">Get a List of Users endpoint</a> to retrieve IDs for all of the users within your Apollo account.
          <br><br>Example: `67e33d527de088000daa60c4`'
        schema:
          type: array
          default: ''
          items:
            type: string
      - name: contact_id
        in: query
        required: false
        description: 'Designate the contact that was called. <br><br>Use the <a href="https://docs.apollo.io/reference/search-for-contacts#/"
          target="_blank">Search for Contacts endpoint</a> to retrieve IDs for all of the contacts within your Apollo account.
          <br><br>Example: `66e34b81740c50074e3d1bd4`'
        schema:
          type: string
          default: ''
      - name: account_id
        in: query
        required: false
        description: 'Associate the call with an account. <br><br>Use the <a href="https://docs.apollo.io/reference/search-for-accounts#/"
          target="_blank">Search for Accounts endpoint</a> to retrieve IDs for all of the accounts within your Apollo account.
          <br><br>Example: `66e9abf95ac32901b20d1a0d`'
        schema:
          type: string
          default: ''
      - name: to_number
        in: query
        required: false
        description: 'The phone number that you dialed. <br><br>Example: `5555550164`'
        schema:
          type: string
          default: ''
      - name: from_number
        in: query
        required: false
        description: 'The phone number that dialed you. <br><br>Example: `5555550164`'
        schema:
          type: string
          default: ''
      - name: status
        in: query
        required: false
        description: 'The status of the phone call. Possible values include: <ul> <li>`queued`</li> <li>`ringing`</li> <li>`in-progress`</li>
          <li>`completed`</li> <li>`no_answer`</li> <li>`failed`</li> <li>`busy`</li></ul>'
        schema:
          type: string
          default: ''
      - name: start_time
        in: query
        required: false
        description: 'The time when the call started. <br><br>Your entry should adhere to the ISO 8601 date-time format. Apollo
          uses Greenwich Mean Time (GMT) by default. If you do not account for time zone differences, you could add a start
          time that falls on a different day than you intended. <br><br>The value you enter can either adhere to GMT, or you
          can adjust the time manually by specifiying in hours and minutes how much you want to offset GMT. <br><br>Example:
          `2025-02-15T08:10:30Z`; `2025-03-25T10:15:30+05:00Z`'
        schema:
          type: string
          format: date-time
          default: ''
      - name: end_time
        in: query
        required: false
        description: 'The time when the call ended. <br><br>Your entry should adhere to the ISO 8601 date-time format. Apollo
          uses Greenwich Mean Time (GMT) by default. If you do not account for time zone differences, you could add a end
          time that falls on a different day than you intended. <br><br>The value you enter can either adhere to GMT, or you
          can adjust the time manually by specifiying in hours and minutes how much you want to offset GMT. <br><br>Example:
          `2025-05-15T08:10:30Z`; `2025-05-25T10:15:30+05:00Z`'
        schema:
          type: string
          format: date-time
          default: ''
      - name: duration
        in: query
        required: false
        description: 'The duration of the call in seconds. Do not enter minutes. <br><br>Examples: `120`; `205`'
        schema:
          type: integer
          default: ''
      - name: phone_call_purpose_id
        in: query
        required: false
        description: 'Assign a call purpose to the record. <br><br>Call purposes are unique to your team''s Apollo account.
          When you use the <b>Purpose</b> search filter for calls in the Apollo product, you can find the corresponding call
          purpose ID in the URL. <br><br>Examples: `6095a710bd01d100a506d4cd`'
        schema:
          type: string
          default: ''
      - name: phone_call_outcome_id
        in: query
        required: false
        description: 'Assign a call outcome to the record. <br><br>Call outcomes are unique to your team''s Apollo account.
          When you use the <b>Disposition</b> search filter for calls in the Apollo product, you can find the corresponding
          call outcome ID in the URL. <br><br>Examples: `6095a710bd01d100a506d4c5`'
        schema:
          type: string
          default: ''
      - name: note
        in: query
        required: false
        description: 'Add a note to the call record. <br><br>Example: `This lead is interested in learning more about our
          new product line.`'
        schema:
          type: string
          default: ''
      - in: path
        name: id
        description: 'The Apollo ID for the call record that you want to update. <br><br>To find call record IDs, call the
          <a href="https://docs.apollo.io/reference/search-for-calls#/" target="_blank">Search for Calls endpoint</a> and
          identify the `id` value for the call record. <br><br>Example: `6859b0dd828b270021e69648`'
        schema:
          type: string
        required: true
