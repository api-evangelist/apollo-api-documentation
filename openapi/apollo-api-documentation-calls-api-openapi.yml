          type: string
          format: date-time
          default: ''
      - name: end_time
        in: query
        required: false
        description: 'The time when the call ended. <br><br>Your entry should adhere to the ISO 8601 date-time format. Apollo
          uses Greenwich Mean Time (GMT) by default. If you do not account for time zone differences, you could add a end
          time that falls on a different day than you intended. <br><br>The value you enter can either adhere to GMT, or you
          can adjust the time manually by specifiying in hours and minutes how much you want to offset GMT. <br><br>Example:
          `2025-05-15T08:10:30Z`; `2025-05-25T10:15:30+05:00Z`'
        schema:
          type: string
          format: date-time
          default: ''
