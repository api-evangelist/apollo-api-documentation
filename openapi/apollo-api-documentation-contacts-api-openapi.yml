  /contacts/update_stages:
    post:
      summary: Update Contact Stage for Multiple Contacts
      description: '## Endpoint essentials


        **API key access:** `api/v1/contacts/update_stages` or `Master API key`


        **OAuth scopes:** `contact_stages_update`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4410623601165-Contact-and-Account-Stages-Overview" target="_blank">Contact
        stages</a> help you track progress on sales and marketing pipelines.<br><br>Use the Update Contact Stage for Multiple
        Contacts endpoint to update the contact stage for several contacts in your team''s Apollo account.<br><br>To update
        more than the contact stage, such as job titles or contact details, use the <a href="https://docs.apollo.io/reference/update-a-contact">Update
        a Contact endpoint</a> instead.'
      tags:
      - Contacts
      operationId: update-contact-stage
      parameters:
      - name: contact_ids[]
        in: query
        description: 'The Apollo IDs for the contacts that you want to update. <br><br>To find contact IDs, call the <a href="https://docs.apollo.io/reference/search-for-contacts"
          target="_blank">Search for Contacts endpoint</a> and identify the `id` value for the contact. <br><br>Example: `66e34b81740c50074e3d1bd4`'
        required: true
        schema:
          type: array
          items:
            type: string
      - name: contact_stage_id
        in: query
        description: 'The Apollo ID for the contact stage to which you want to assign the contacts. Call the <a href="https://docs.apollo.io/reference/list-contact-stages"
          target="_blank">List Contact Stages endpoint</a> to retrieve a list of all the contact stage IDs available in your
          Apollo account. <br><br>Example: `6095a710bd01d100a506d4af`'
