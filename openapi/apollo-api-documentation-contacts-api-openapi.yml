  /contacts/search:
    post:
      summary: Search for Contacts
      description: '## Endpoint essentials


        **API key access:** `api/v1/contacts/search` or `Master API key`


        **OAuth scopes:** `contacts_search`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/5995459280525-View-and-Edit-Contacts" target="_blank">Contacts</a>
        are people saved in Apollo.<br><br>Use the Search for Contacts endpoint to search for the contacts that have been
        added to your team''s Apollo account.<br><br>This endpoint only returns contacts in the search results. To search
        for people in the Apollo database, call the <a href="https://docs.apollo.io/reference/people-api-search">People API
        Search endpoint</a>.<br><br>To protect Apollo''s performance for all users, this endpoint has a display limit of 50,000
        records (100 records per page, up to 500 pages). Add more filters to narrow your search results as much as possible.'
      tags:
      - Contacts
      operationId: search-for-contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q_keywords:
                  type: string
                  description: 'Add a keyword search string to narrow the contacts in your team''s Apollo account. Keywords
                    should be related to the same search concept and can include names, job titles, employers or company names,
                    or email addresses. Examples: `matthew helm`; `CEO`; `Sumware Software`'
                contact_stage_ids:
                  type: array
                  items:
                    type: string
                  description: 'The Apollo IDs for the contact stages that you want to include in your search results. If
                    you add multiple contact stages, Apollo will include all contacts that match any of the stages, along
                    with the other parameters, in the search results. Call the [List Contact Stages endpoint](https://docs.apollo.io/reference/list-contact-stages)
                    to retrieve a list of all the contact stage IDs available in your Apollo account. Example: `6095a710bd01d100a506d4ae`'
                contact_label_ids:
                  type: array
                  items:
                    type: string
                  description: 'The Apollo IDs for the labels that you want to include in your search results. If you add
                    multiple labels, Apollo will include all contacts connected to any of the labels, along with the other
                    parameters, in the search results. Example: `[''6095a710bd01d100a506d4ae'']`'
                sort_by_field:
                  type: string
                  description: "Sort the matching contacts by 1 of the following options: \n- `contact_last_activity_date`:\
                    \ The most recent activity date recorded first.\n- `contact_email_last_opened_at`: The most recent email\
                    \ opened date first.\n- `contact_email_last_clicked_at`: The most recent email clicked first.\n- `contact_created_at`:\
                    \ The most recently created first.\n- `contact_updated_at`: The most recently updated first."
                sort_ascending:
                  type: boolean
                  default: false
                  description: 'Set to `true` to sort the matching contacts in ascending order. This parameter must be used
                    with `sort_by_field`. Otherwise, the sorting logic is not applied. Example: `true`'
                per_page:
                  type: integer
                  format: int32
                  description: 'The number of search results that should be returned for each page. Limiting the number of
                    results per page improves the endpoint''s performance. Use the `page` parameter to search the different
                    pages of data. Example: `10`'
                page:
                  type: integer
                  format: int32
                  description: 'The page number of the Apollo data that you want to retrieve. Use this parameter in combination
                    with the `per_page` parameter to make search results navigable and improve the performance of the endpoint.
                    Example: `4`'
