  /contacts/update_owners:
    post:
      summary: Update Contact Owner for Multiple Contacts
      description: '## Endpoint essentials


        **API key access:** `api/v1/contacts/update_owners` or `Master API key`


        **OAuth scopes:** `contact_owners_update`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/5631686093069-Edit-a-Contact-or-Account-Owner" target="_blank">Contact
        owners</a> manage specific contacts in Apollo.<br><br>Use the Update Contact Owner for Multiple Contacts endpoint
        to assign multiple contacts to a different user in your team''s Apollo account. <br><br>To update more than the contact''s
        owner, such as job titles or contact details, use the <a href="https://docs.apollo.io/reference/update-a-contact">Update
        a Contact endpoint</a> instead.'
      tags:
      - Contacts
      operationId: update-contact-ownership
      parameters:
      - name: contact_ids[]
        in: query
        description: 'The Apollo IDs for the contacts that you want assign to an owner. <br><br>To find contact IDs, call
          the <a href="https://docs.apollo.io/reference/search-for-contacts" target="_blank">Search for Contacts endpoint</a>
          and identify the `id` value for the contact. <br><br>Example: `66e34b81740c50074e3d1bd4`'
        required: true
        schema:
          type: array
          items:
            type: string
      - name: owner_id
        in: query
        description: 'The ID for the contact owner within your team''s Apollo account. This user will be assigned ownership
          of the contacts. <br><br>Use the <a href="https://docs.apollo.io/reference/get-a-list-of-users" target="_blank">Get
          a List of Users endpoint</a> endpoint to retrieve IDs for all of the users within your Apollo account. <br><br>Example:
          `66302798d03b9601c7934ebf`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"contacts\": [\n    {\n      \"id\": \"66e379b5a385c703da3d729f\",\n      \"owner_id\": \"\
                    66302798d03b9601c7934ebf\",\n      \"crm_owner_id\": null\n    },\n    {\n      \"id\": \"66e370fbf5f5c003f0e1d0cf\"\
                    ,\n      \"owner_id\": \"66302798d03b9601c7934ebf\",\n      \"crm_owner_id\": null\n    },\n    {\n  \
                    \    \"id\": \"66e3491845dae20d5a2015ff\",\n      \"owner_id\": \"66302798d03b9601c7934ebf\",\n      \"\
                    crm_owner_id\": null\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 66e379b5a385c703da3d729f
                        owner_id:
                          type: string
                          example: 66302798d03b9601c7934ebf
                        crm_owner_id: {}
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Result:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Check contact IDs:
                  value: "{\n  \"error\": \"Required parameter 'contact_ids' missing\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Required parameter 'contact_ids' missing
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n    \"message\": \"The maximum number of api calls allowed for api/v1/contacts/update_owners\
                    \ is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\
                    \n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/contacts/update_owners is 600 times per hour.
                      Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
  /contacts/bulk_create:
    post:
      summary: Bulk Create Contacts
      description: '## Endpoint essentials


        **API key access:** `api/v1/contacts/bulk_create` or `Master API key`


        **OAuth scopes:** `contacts_bulk_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/5995459280525-View-and-Edit-Contacts" target="_blank">Contacts</a>
        are people saved in Apollo.<br><br>Use the Bulk Create Contacts endpoint to create up to 100 contacts in a single
        API request. This endpoint supports intelligent deduplication and returns separated arrays for newly created and existing
        contacts. <br><br>Important: This endpoint creates new contacts but doesn''t update existing ones (except for placeholder
        contacts from email imports). Existing contacts that match the criteria are returned in the <code>existing_contacts</code>
        array without modification.<br><br>To update existing contacts, use the <a href="https://docs.apollo.io/reference/bulk-update-contacts">Bulk
        Update Contacts endpoint</a>.'
      tags:
      - Contacts
      operationId: bulk-create-contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  description: Array of contact objects to create (maximum 100 contacts per request)
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      first_name:
                        type: string
                        description: Contact's first name
                        example: John
                      last_name:
                        type: string
                        description: Contact's last name
                        example: Doe
                      email:
                        type: string
                        description: Contact's email address
                        example: john.doe@example.com
                      title:
                        type: string
                        description: Contact's job title
                        example: Senior Manager
                      primary_title:
                        type: string
                        description: Primary job title (takes precedence over title)
                        example: VP of Sales
                      organization_name:
                        type: string
                        description: Company/organization name
                        example: Acme Corporation
                      phone:
                        type: string
                        description: Phone number
                        example: +1-555-0135
                      present_raw_address:
                        type: string
                        description: Physical address
                        example: San Francisco, CA
                      linkedin_url:
                        type: string
                        description: LinkedIn profile URL
                        example: https://www.linkedin.com/in/john-doe-3f9a7c21
                      facebook_url:
                        type: string
                        description: Facebook profile URL
                        example: https://www.facebook.com/johndoe
                      twitter_url:
                        type: string
                        description: Twitter profile URL
                        example: https://twitter.com/johndoe
                      photo_url:
                        type: string
                        description: Profile photo URL
                        example: https://example.com/photo.jpg
                      account_id:
                        type: string
                        description: Associated account ID
                        example: 507f1f77bcf86cd799439011
                      organization_id:
                        type: string
                        description: Associated organization ID
                        example: 507f1f77bcf86cd799439012
                      contact_stage_id:
                        type: string
                        description: Contact stage ID
                        example: 507f1f77bcf86cd799439014
                      salesforce_id:
                        type: string
                        description: Salesforce ID for matching and deduplication
                        example: 003xx000004TmiQAAS
                      hubspot_id:
                        type: string
                        description: HubSpot ID for matching and deduplication
                        example: '12345678'
                      salesforce_lead_id:
                        type: string
                        description: Salesforce Lead ID
                        example: 00Qxx000001abcDEFG
                      salesforce_contact_id:
                        type: string
                        description: Salesforce Contact ID for matching
                        example: 003xx000004TmiQAAS
                      salesforce_account_id:
                        type: string
                        description: Salesforce Account ID
                        example: 001pJNj9pix2idKsfj
                      outreach_id:
                        type: string
                        description: Outreach.io ID
                        example: '98765'
                      salesloft_id:
                        type: string
                        description: SalesLoft ID
                        example: '54321'
                      phone_status_cd:
                        type: string
                        description: Phone validation status
                      typed_custom_fields:
                        type: object
                        description: Custom field values as key-value pairs where key is the field_id and value is the field_value
                        additionalProperties:
                          type: string
                        example:
                          60c39ed82bd02f01154c470a: '2025-08-07'
                      contact_emails:
                        type: array
                        description: Array of email objects with position
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              example: john.doe@example.com
                            position:
                              type: integer
                              example: 0
                      phone_numbers:
                        type: array
                        description: Array of phone number objects
                        items:
                          type: object
                          properties:
                            raw_number:
                              type: string
                              example: +1-555-0135
                            position:
                              type: integer
                              example: 0
                      contact_role_type_ids:
                        type: array
                        description: Array of contact role type IDs
                        items:
                          type: string
                        example:
                        - 507f1f77bcf86cd799439020
                append_label_names:
                  type: array
                  description: Array of label names to add to ALL contacts in this request
                  items:
                    type: string
                  example:
                  - Hot Lead
                  - Q1 2024
                owner_id:
                  type: string
                  description: Owner user ID applied to all contacts in this batch. Defaults to current user if omitted. Returns
                    422 if the ID does not belong to the current team.
                  example: 507f1f77bcf86cd799439013
                run_dedupe:
                  type: boolean
                  description: 'Enable full deduplication across all sources. When false (default), creates duplicates for
                    non-email_import sources and merges with email_import placeholders only. When true, returns existing contacts
                    in `existing_contacts` without modifying them (except email_import placeholders, which are still merged).
                    <br><br>Matching is checked in order: `id`, CRM identifiers, `person_id`, `email` (against the contact''s
                    primary and additional emails), then name plus company (matched on email domain, `organization_id`, or
                    `organization_name`). <br><br>Unlike <a href="https://docs.apollo.io/reference/create-a-contact">Create
                    a Contact</a>, this endpoint never overwrites a matched contact''s fields.'
                  default: false
                  example: true
            examples:
              Basic Contact Creation:
                value:
                  contacts:
                  - first_name: John
                    last_name: Doe
                    email: john.doe@example.com
                    title: Senior Manager
                    organization_name: Acme Corporation
                  - first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
                    title: VP of Sales
                    organization_name: TechStart Inc
                    linkedin_url: https://www.linkedin.com/in/jane-smith-4c8e21a9
              With Full Deduplication (Returns Existing Without Updating):
                value:
                  contacts:
                  - email: existing@example.com
                    first_name: New
                    last_name: Name
                    title: New Title
                  run_dedupe: true
              With CRM IDs (Returns Existing Without Updating):
                value:
                  contacts:
                  - salesforce_contact_id: 003xx000004TmiQAAS
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
                    phone: +1-555-0159
                  - hubspot_id: '12345678'
                    first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
              With Custom Fields and Labels:
                value:
                  contacts:
                  - first_name: Sarah
                    last_name: Whitfield
                    email: sarah.whitfield@example.com
                    title: CTO
                    organization_name: Enterprise Corp
                    contact_stage_id: 507f1f77bcf86cd799439014
                    typed_custom_fields:
                      60c39ed82bd02f01154c470a: '2025-12-31'
                      60c39ed82bd02f01154c470b: High Priority
                  append_label_names:
                  - VIP
                  - Decision Maker
              With Multiple Contact Details:
                value:
                  contacts:
                  - first_name: Michael
                    last_name: Brown
                    organization_name: Tech Solutions
                    contact_emails:
                    - email: michael.brown@example.com
                      position: 0
                    - email: mbrown@example.com
                      position: 1
                    phone_numbers:
                    - raw_number: +1-555-0135
                      position: 0
                    - raw_number: +1-555-0122
                      position: 1
              With Top-Level Owner Assignment:
                value:
                  contacts:
                  - first_name: Alice
                    last_name: Chen
                    email: alice.chen@example.com
                    title: Director of Engineering
                    organization_name: CloudCo
                    account_id: 507f1f77bcf86cd799439011
                  - first_name: Bob
                    last_name: Lee
                    email: bob.lee@example.com
                    title: Head of Product
                    organization_name: CloudCo
                    account_id: 507f1f77bcf86cd799439011
                  owner_id: 507f1f77bcf86cd799439013
      responses:
        '200':
          description: 200 - Successful bulk create operation
          content:
            application/json:
              examples:
                Result:
                  value:
                    created_contacts:
                    - id: 507f1f77bcf86cd799439011
                      first_name: John
                      last_name: Doe
                      email: john.doe@example.com
                      title: Senior Manager
                      organization_name: Acme Corporation
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      contact_stage_id: 507f1f77bcf86cd799439014
                      created_at: '2025-10-16T18:30:00Z'
                      updated_at: '2025-10-16T18:30:00Z'
                    - id: 507f1f77bcf86cd799439017
                      first_name: Jane
                      last_name: Smith
                      email: jane.smith@example.com
                      title: VP of Sales
                      organization_name: TechStart Inc
                      linkedin_url: https://www.linkedin.com/in/jane-smith-4c8e21a9
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      created_at: '2025-10-16T18:30:00Z'
                      updated_at: '2025-10-16T18:30:00Z'
                    existing_contacts:
                    - id: 507f1f77bcf86cd799439015
                      first_name: Original
                      last_name: Name
                      email: existing@example.com
                      title: Original Title
                      team_id: 507f1f77bcf86cd799439012
                      owner_id: 507f1f77bcf86cd799439013
                      created_at: '2025-09-01T10:00:00Z'
                      updated_at: '2025-09-15T14:30:00Z'
              schema:
                type: object
                properties:
                  created_contacts:
                    type: array
                    description: Array of newly created contacts
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Contact ID
                          example: 507f1f77bcf86cd799439011
                        first_name:
                          type: string
                          description: Contact's first name
                          example: John
                        last_name:
                          type: string
                          description: Contact's last name
                          example: Doe
                        email:
                          type: string
                          description: Contact's email address
                          example: john.doe@example.com
                        title:
                          type: string
                          description: Contact's job title
                          example: Senior Manager
                        organization_name:
                          type: string
                          description: Company/organization name
                          example: Acme Corporation
                        team_id:
                          type: string
                          description: Team ID
                          example: 507f1f77bcf86cd799439012
                        owner_id:
                          type: string
                          description: Contact owner ID
                          example: 507f1f77bcf86cd799439013
                        contact_stage_id:
                          type: string
                          description: Contact stage ID
                          example: 507f1f77bcf86cd799439014
                        created_at:
                          type: string
                          format: date-time
                          description: Contact creation timestamp
                          example: '2025-10-16T18:30:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Contact last update timestamp
                          example: '2025-10-16T18:30:00Z'
                  existing_contacts:
                    type: array
                    description: Array of existing contacts that matched deduplication criteria (returned without modification,
                      except for email_import placeholders which may be merged)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Contact ID
                          example: 507f1f77bcf86cd799439015
                        first_name:
                          type: string
                          description: Contact's first name
                          example: Original
                        last_name:
                          type: string
                          description: Contact's last name
                          example: Name
                        email:
                          type: string
                          description: Contact's email address
                          example: existing@example.com
                        title:
                          type: string
                          description: Contact's job title
                          example: Original Title
                        team_id:
                          type: string
                          description: Team ID
                          example: 507f1f77bcf86cd799439012
                        owner_id:
                          type: string
                          description: Contact owner ID
                          example: 507f1f77bcf86cd799439013
                        created_at:
                          type: string
                          format: date-time
                          description: Contact creation timestamp
                          example: '2025-09-01T10:00:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Contact last update timestamp
                          example: '2025-09-15T14:30:00Z'
        '401':
