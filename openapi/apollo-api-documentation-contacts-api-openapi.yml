      bearerFormat: JWT
      description: 'OAuth 2.0 access token, used by Apollo partners building integrations.

        See the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).'
paths:
  /contacts:
    post:
      summary: Create a Contact
      description: '## Endpoint essentials


        **API key access:** `api/v1/contacts/create` or `Master API key`


        **OAuth scopes:** `contact_write`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/5995459280525-View-and-Edit-Contacts" target="_blank">Contacts</a>
        are people saved in Apollo.<br><br>Use the Create a Contact endpoint to add a new contact to your team''s Apollo  account.<br><br>By
        default, Apollo doesn''t apply deduplication processes when you create a new contact via API. If your entry has the
        same name, email address, or other details as an existing contact, Apollo creates a new contact instead of updating
        the existing contact. To enable deduplication and prevent duplicate contacts, set the <code>run_dedupe</code> parameter
        to <code>true</code>. <br><br>To update an existing contact, use the <a href="https://docs.apollo.io/reference/update-a-contact">Update
        a Contact endpoint</a> instead.


        ### What `run_dedupe` actually does


        Setting `run_dedupe` to `true` does more than suppress a duplicate. On a match, Apollo **updates that existing contact
        in place** with your request''s values and returns it. The response looks like a creation, but the `id` belongs to
        the pre-existing contact — so treating every `200` as "a new contact was created" doesn''t hold once `run_dedupe`
        is on.


        **How Apollo picks the match.** It checks these in order and stops at the first hit, so a match isn''t necessarily
        on email:


        1. `id`, if you send one.

        2. CRM identifiers: `salesforce_lead_id`, `salesforce_contact_id`, `hubspot_vid`, or a previously merged CRM ID.

        3. `person_id`.

        4. `email` — compared against the contact''s primary email **and** any additional emails stored on it.

        5. `first_name` plus `last_name` (or a full name) with a matching company, where the company matches on email domain,
        `organization_id`, or `organization_name`.


        Because of step 5, a contact can be matched and updated even when the email you send differs from the stored one.


        **What the update writes.** It''s a field-level overwrite of the values you send, not a merge that prefers existing
        data:


        * Fields you **send** overwrite the stored values, with no warning and no record of the previous value.

        * Fields you **omit** are left untouched, so you don''t need to resend the whole record.

        * An **empty value clears the field** rather than being ignored.

        * The contact''s `email` can itself be overwritten when the match came from a CRM ID, `person_id`, or name-plus-company.
        `email_status` isn''t re-verified, so it can keep reading `verified` while describing the previous address.

        * Protected once set: `person_id`, `salesforce_lead_id`, and `salesforce_contact_id`. LinkedIn-sourced photos won''t
        replace an existing `photo_url`.


        **Recommended handling.** To add records without changing existing ones, leave `run_dedupe` off (the default) and
        reconcile duplicates yourself. To upsert, set it to `true` and send the complete set of fields you want the contact
        to end up with, since omitted fields keep their old values. To edit a known contact, prefer [Update a Contact](https://docs.apollo.io/reference/update-a-contact)
        with its `id` — explicit, with no matching involved.


        [Bulk Create Contacts](https://docs.apollo.io/reference/bulk-create-contacts) differs: matched contacts are returned
        in `existing_contacts` **without** being modified.'
      tags:
      - Contacts
      operationId: create-a-contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'The first name of the contact you want to create. Example: `Tim`'
                last_name:
                  type: string
                  description: 'The last name of the contact you want to create. Example: `Zheng`'
                organization_name:
                  type: string
                  description: 'The name of the contact''s employer (company). Example: `apollo`'
                title:
                  type: string
                  description: 'The current job title that the contact holds. Example: `senior research analyst`'
                account_id:
                  type: string
                  description: 'The Apollo ID for the account. Example: `63f53afe4ceeca00016bdd2f`'
                email:
                  type: string
                  description: 'The email address of the contact. Example: `example@email.com`'
                website_url:
                  type: string
                  description: 'The corporate website URL. Example: `https://www.apollo.io/`'
                label_names:
                  type: array
                  description: Lists to which the contact belongs.
                  items:
                    type: string
                contact_stage_id:
                  type: string
                  description: 'The Apollo ID for the contact stage. Example: `6095a710bd01d100a506d4ae`'
                present_raw_address:
                  type: string
                  description: 'The personal location for the contact. Example: `Atlanta, United States`'
                direct_phone:
                  type: string
                  description: 'The primary phone number. Example: `555-555-0133`'
                corporate_phone:
                  type: string
                  description: 'The work/office phone number. Example: `+44 7700 900852`'
                mobile_phone:
                  type: string
                  description: 'The mobile phone number. Example: `555-555-0133`'
                home_phone:
                  type: string
                  description: 'The home phone number. Example: `555-555-0133`'
                other_phone:
                  type: string
                  description: 'Alternative phone number. Example: `555-555-0133`'
                typed_custom_fields:
                  type: object
                  description: "Add information to <a href=\"https://knowledge.apollo.io/hc/en-us/articles/4412498825869-Create-Custom-Contact-Fields\"\
                    \ target=\"_blank\">custom fields</a> in Apollo. <br><br><b>Your custom fields are unique to your team's\
                    \ Apollo account. This means that the examples in this documentation may not work for your testing purposes.</b>\
                    \ <br><br>To utilize this parameter successfully, call the <a href=\"https://docs.apollo.io/reference/get-a-list-of-all-custom-fields\"\
                    >Get a List of All Custom Fields</a> endpoint and identify the `id` value for the custom field, as well\
                    \ as the appropriate data type. For example, if a custom field accepts picklist entries, you need to pass\
                    \ the accompanying `id` value for the picklist entry that you want to use as the input value. <br><br><b>Example</b>:\
                    \ When the <a href=\"https://docs.apollo.io/reference/get-a-list-of-all-custom-fields\">Get a List of\
                    \ All Custom Fields</a> endpoint returns an `id` of field: \n * `\"60c39ed82bd02f01154c470a\"` (datetime)\
                    \ \n \n\n then the value passed should be: \n\n `{\"60c39ed82bd02f01154c470a\": \"2025-08-07\"}`"
                  additionalProperties:
                    type: string
                  example:
                    60c39ed82bd02f01154c470a: '2025-08-07'
                run_dedupe:
                  type: boolean
                  description: 'Set to `true` to match against your existing contacts instead of always creating a new one.
                    The default value is `false`. <br><br>When a match is found, Apollo **updates that existing contact in
                    place** with the values you sent and returns it — the `id` in the response belongs to the pre-existing
                    contact, not a new record. Fields you send overwrite the stored values, fields you omit are left untouched,
                    and sending an empty value clears the field. <br><br>Matching is checked in order: `id`, CRM identifiers,
                    `person_id`, `email` (against the contact''s primary and additional emails), then name plus company. Because
                    of the last rule, a contact can be matched and updated even when the email differs. <br><br>When deduplication
                    is enabled, performance may be slightly impacted due to the additional matching checks. See the endpoint
                    description for full details.'
                  default: false
            examples:
              Create contact without deduplication:
                summary: Create a new contact without deduplication (default behavior)
                value:
                  first_name: John
                  last_name: Smith
                  email: john.smith@example.com
                  organization_name: Example Corp
                  title: Software Engineer
              Create contact with deduplication:
                summary: Create a new contact with deduplication enabled
                value:
                  first_name: Jane
                  last_name: Doe
                  email: jane.doe@example.com
                  organization_name: Example Corp
                  title: Product Manager
                  run_dedupe: true
