    post:
      summary: Create a List
      description: '## Endpoint essentials


        **API key access:** `api/v1/labels/create` or `Master API key`


        **OAuth scopes:** `lists_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        A <a href="https://knowledge.apollo.io/hc/en-us/articles/4409728608525-Create-and-Use-a-List" target="_blank">list</a>
        is a saved group of contacts or accounts in Apollo that you can organize, action, and track together.<br><br>Use the
        Create a List endpoint to create a new, empty contact or account list in your team''s Apollo account. After you create
        a list, add records to it with the <a href="https://docs.apollo.io/reference/add-records-to-a-list">Add Records to
        a List endpoint</a>.<br><br>List names must be unique for each modality within your team. If you try to create a list
        with a name that already exists for the same modality, Apollo returns a `422` response.'
      tags:
      - Miscellaneous
      operationId: create-a-list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - modality
              properties:
                name:
                  type: string
                  description: 'The name for the new list. Must be unique for the given `modality` within your team.<br><br>Example:
                    `Conference 2024 - Maui`'
                modality:
                  type: string
                  enum:
                  - contacts
                  - accounts
                  description: 'The type of records the list holds. <ul><li>`contacts`: a list of contacts (people).</li><li>`accounts`:
                    a list of accounts (companies).</li></ul>'
                book_of_business:
                  type: boolean
                  description: Set to `true` to mark an account list as a Book of Business (BoB) list. Only applies when `modality`
                    is `accounts`. Defaults to `false`.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: object
                    properties:
                      id:
                        type: string
                      modality:
                        type: string
                      cached_count:
                        type: integer
                      name:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      user_id:
                        type: string
                      book_of_business:
                        type: boolean
                        nullable: true
              examples:
                Result:
                  value:
                    label:
                      id: 6612a4b7c8d9e0f123456789
