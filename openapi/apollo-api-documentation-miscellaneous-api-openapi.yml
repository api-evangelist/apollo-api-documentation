  /webhook_result/{request_id}:
    get:
      summary: Poll Webhook Result
      description: '## Endpoint essentials


        **API key access:** `api/v1/webhook_result/show` or `Master API key`


        **OAuth scopes:** `webhook_result_read`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        Use the Poll Webhook Result endpoint to retrieve webhook results from Apollo. This endpoint enables you to poll for
        the webhook payload if you didn''t receive the original webhook callback.<br><br>To use this endpoint, you need the
        <code>request_id</code> from the <a href="https://docs.apollo.io/reference/people-enrichment">People Enrichment</a>
        or <a href="https://docs.apollo.io/reference/bulk-people-enrichment">Bulk People Enrichment</a> endpoint. Pass this
        value as <code>request_id</code> in this endpoint.<br><br>This endpoint returns webhook results for your team from
        up to thirty days after the webhook was triggered.<br><br>While an enrichment is still processing, this endpoint returns
        a <code>404</code> with <code>error_code: result_pending</code> and a <code>retry_after_seconds</code> value—wait
        that many seconds and poll again. Once the result is ready, it returns a <code>200</code>.<br><br>Three responses
        are terminal, so stop polling if you receive any of them: <code>request_id_unknown</code> (<code>404</code>—the <code>request_id</code>
        is not recognized, usually because it was mistyped or never issued), <code>request_id_expired</code> (<code>410</code>—the
        result has aged out past the 30-day window, so start a fresh enrichment request), and <code>invalid_request_id</code>
        (<code>400</code>—the <code>request_id</code> is not a valid signed 64-bit integer).'
      tags:
      - Miscellaneous
      operationId: poll-webhook-result
      parameters:
      - name: request_id
        in: path
        required: true
        description: 'The <code>request_id</code> returned when the original enrichment request was submitted. This value
          is a signed 64-bit integer and can be positive or negative. <br><br>Example: <code>1039995589705121900</code>'
        schema:
