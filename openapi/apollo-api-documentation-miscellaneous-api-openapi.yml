  /usage_stats/credit_usage_stats:
    post:
      summary: View Credit Usage Stats
      description: '## Endpoint essentials


        **API key access:** `api/v1/usage_stats/credit_usage_stats` or `Master API key`


        **OAuth scopes:** `credit_usage_stats_read`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        Use the View Credit Usage Stats endpoint to monitor your team''s credit balance across every credit type in the current
        billing cycle.


        For each credit type, the response returns the `limit` (your team''s allowance for the cycle), `consumed` (credits
        used so far), and `left_over` (credits remaining). The `current_credit_cycle` object reports the start and end dates
        of the billing cycle these stats cover.


        Balances reflect your team''s running credit usage and update within seconds of a credit-consuming request. To retrieve
        credit usage for a single user instead of the whole team, use [Get Current User Profile](https://docs.apollo.io/reference/get-current-user-profile)
        with the `include_credit_usage` query parameter set to `true`.


        ### Credit types


        The `credit_usage_stats` object is keyed by credit type. Each key funds a different Apollo action:


        | Key | What it funds |

        | --- | --- |

        | `lead_credit` | Email address reveals and email enrichment. |

        | `direct_dial_credit` | Mobile and direct dial phone number reveals. |

        | `export_credit` | CSV exports of contacts and accounts. |

        | `conversation_credit` | Conversation intelligence and call recording. |

        | `ai_credit` | AI-generated email writing. |

        | `power_up_credit` | AI power-up field enrichment on contact and account records. |

        | `inbound_website_visitor_credit` | Inbound website visitor identification. |

        | `contact_website_visitor_credit` | Contact-level website visit tracking. |

        | `web_search_record_credit` | Web search enrichment records. |

        | `dialer` | Dialer talk time. Reported in **minutes**, not credits. |


        A credit type your <a href="https://app.apollo.io/#/settings/plans/upgrade" target="_blank">Apollo plan</a> doesn''t
        include returns a `limit` of `0`.


        If your team is on a unified credit plan, `lead_credit` is a shared pool: the `left_over` value already accounts for
        mobile reveals, exports, dialer minutes, and power-up enrichment, so don''t add the individual balances together to
        estimate what''s left.'
      tags:
      - Miscellaneous
      operationId: view-credit-usage-stats
      responses:
        '200':
          description: ''
          content:
            application/json:
              examples:
                OK:
                  summary: OK
                  value: "{\n  \"credit_usage_stats\": {\n    \"lead_credit\": {\n      \"limit\": 10000,\n      \"consumed\"\
                    : 2500,\n      \"left_over\": 7500\n    },\n    \"direct_dial_credit\": {\n      \"limit\": 1000,\n  \
                    \    \"consumed\": 120,\n      \"left_over\": 880\n    },\n    \"export_credit\": {\n      \"limit\":\
                    \ 5000,\n      \"consumed\": 250,\n      \"left_over\": 4750\n    },\n    \"conversation_credit\": {\n\
                    \      \"limit\": 500,\n      \"consumed\": 30,\n      \"left_over\": 470\n    },\n    \"ai_credit\":\
                    \ {\n      \"limit\": 2000,\n      \"consumed\": 75,\n      \"left_over\": 1925\n    },\n    \"power_up_credit\"\
                    : {\n      \"limit\": 1000,\n      \"consumed\": 40,\n      \"left_over\": 960\n    },\n    \"inbound_website_visitor_credit\"\
                    : {\n      \"limit\": 1000,\n      \"consumed\": 60,\n      \"left_over\": 940\n    },\n    \"dialer\"\
                    : {\n      \"limit\": 500,\n      \"consumed\": 12,\n      \"left_over\": 488\n    },\n    \"web_search_record_credit\"\
                    : {\n      \"limit\": 1000,\n      \"consumed\": 0,\n      \"left_over\": 1000\n    },\n    \"contact_website_visitor_credit\"\
                    : {\n      \"limit\": 1000,\n      \"consumed\": 15,\n      \"left_over\": 985\n    }\n  },\n  \"current_credit_cycle\"\
                    : {\n    \"start_date\": \"2026-04-01T00:00:00.000Z\",\n    \"end_date\": \"2026-05-01T00:00:00.000Z\"\
                    \n  }\n}"
              schema:
                type: object
                properties:
                  credit_usage_stats:
                    type: object
                    description: Credit usage for the current billing cycle, keyed by credit type. Every credit type is always
                      returned; a type your Apollo plan doesn't include returns a `limit` of `0`. See the Credit types table
                      above for what each key funds. Values are credits, except `dialer`, which is reported in minutes.
                    additionalProperties:
                      type: object
                      properties:
                        limit:
                          type: integer
                          example: 10000
                          description: Credit allowance for the current billing cycle.
                        consumed:
                          type: integer
                          example: 2500
                          description: Credits used so far this cycle. Equals `limit` minus `left_over`, and can be negative
                            if remaining exceeds the allowance.
                        left_over:
                          type: integer
                          example: 7500
                          description: Credits remaining for the current billing cycle.
                  current_credit_cycle:
                    type: object
                    description: Start and end of the billing cycle the stats cover. Both values are `null` when the team
                      has no active billing cycle.
                    properties:
                      start_date:
                        type: string
                        format: date-time
                        nullable: true
                        example: '2026-04-01T00:00:00.000Z'
                        description: Start of the current credit cycle.
                      end_date:
                        type: string
                        format: date-time
                        nullable: true
                        example: '2026-05-01T00:00:00.000Z'
                        description: End of the current credit cycle.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Check API Key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                Need Master API Key:
                  value:
                    error: This API key is not authorized to access api/v1/usage_stats/credit_usage_stats. Request an API
                      key from your administrator that includes this endpoint in its configured scope.
                    error_code: API_INACCESSIBLE
                  summary: Need Master API Key
      parameters: []
