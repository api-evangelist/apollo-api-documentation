  /notes:
    get:
      summary: Get a List of Notes
      description: '## Endpoint essentials


        **API key access:** `meetings/api/v1/notes/index` or `Master API key`


        **OAuth scopes:** `notes_list`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/28746467476365-Notes-Overview" target="_blank">Notes</a> on
        Apollo let you keep track of info directly on prospect profiles.<br><br>The Get a List of Notes endpoint retrieves
        notes associated with a specific contact, account, opportunity, calendar event, or conversation in your Apollo account.
        You must provide at least one relation parameter (<code>account_id</code>, <code>contact_id</code>, <code>contact_ids</code>,
        <code>opportunity_id</code>, <code>calendar_event_id</code>, <code>conversation_id</code>, or <code>conversation_ids</code>).
        Use this endpoint to fetch notes with sorting and pagination support.'
      tags:
      - Miscellaneous
      operationId: get-a-list-of-notes
      parameters:
      - name: contact_id
        in: query
        description: 'The ID of the contact whose notes you want to retrieve. <br><br>Example: `60a5c0b8e4b0c7001c4f1234`'
        schema:
          type: string
      - name: account_id
        in: query
        description: 'The ID of the account whose notes you want to retrieve. <br><br>Example: `60a5c0b8e4b0c7001c4f5678`'
        schema:
          type: string
      - name: opportunity_id
        in: query
        description: 'The ID of the opportunity whose notes you want to retrieve. <br><br>Example: `60a5c0b8e4b0c7001c4f9012`'
        schema:
          type: string
      - name: calendar_event_id
        in: query
        description: 'The ID of the calendar event whose notes you want to retrieve. <br><br>Example: `60a5c0b8e4b0c7001c4f3456`'
        schema:
          type: string
      - name: conversation_id
        in: query
        description: 'The ID of the conversation whose notes you want to retrieve. <br><br>Example: `60a5c0b8e4b0c7001c4f7890`'
        schema:
          type: string
      - name: conversation_ids
        in: query
        description: An array of conversation IDs to filter notes by multiple conversations.
        schema:
          type: array
          items:
            type: string
      - name: contact_ids
        in: query
        description: An array of contact IDs to filter notes by multiple contacts.
        schema:
          type: array
          items:
            type: string
      - name: start_date
        in: query
        description: 'Filter notes created on or after this date. Must be a valid date string. <br><br>Example: `2024-01-01`'
        schema:
          type: string
      - name: sort_by_field
        in: query
        description: The field to sort results by. Defaults to `created_at`.
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          default: created_at
      - name: sort_direction
        in: query
        description: The direction to sort results. Defaults to `desc`.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: skip
        in: query
        description: The number of notes to skip for pagination. Must be a non-negative integer. Defaults to `0`.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: The maximum number of notes to return per request. Defaults to `25`. Maximum value is `100`.
        schema:
          type: integer
          default: 25
          maximum: 100
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    notes:
                    - id: 60a5c0b8e4b0c7001c4fabcd
                      user_id: 60a5c0b8e4b0c7001c4f0001
                      content: Had a productive call with the client. They are interested in the enterprise plan.
                      updated_at: '2024-06-15T14:30:00.000Z'
                      created_at: '2024-06-15T14:30:00.000Z'
                      contact_id: 60a5c0b8e4b0c7001c4f1234
                      conversation_id: null
                      account_id: 60a5c0b8e4b0c7001c4f5678
                      pinned_to_top: false
                      system: false
                      opportunity_id: null
                      account_ids: []
                      contact_ids:
                      - 60a5c0b8e4b0c7001c4f1234
                      opportunity_ids: []
                      calendar_event_ids: []
                      conversation_ids: []
                      is_org_chart_note: false
                      crm_notes: []
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier of the note.
                          example: 60a5c0b8e4b0c7001c4fabcd
                        user_id:
                          type: string
                          description: The ID of the user who created the note.
                          example: 60a5c0b8e4b0c7001c4f0001
                        content:
                          type: string
                          description: The content of the note.
                          example: Had a productive call with the client.
                        updated_at:
                          type: string
                          description: The timestamp when the note was last updated.
                          example: '2024-06-15T14:30:00.000Z'
                        created_at:
                          type: string
                          description: The timestamp when the note was created.
                          example: '2024-06-15T14:30:00.000Z'
                        contact_id:
                          type: string
                          nullable: true
                          description: The ID of the associated contact.
                          example: 60a5c0b8e4b0c7001c4f1234
                        conversation_id:
                          type: string
                          nullable: true
                          description: The ID of the associated conversation.
                          example: null
                        account_id:
                          type: string
                          nullable: true
                          description: The ID of the associated account.
                          example: 60a5c0b8e4b0c7001c4f5678
                        pinned_to_top:
                          type: boolean
                          description: Whether the note is pinned to the top.
                          example: false
                        system:
                          type: boolean
                          description: Whether this is a system-generated note.
                          example: false
                        opportunity_id:
                          type: string
                          nullable: true
                          description: The ID of the associated opportunity.
                          example: null
                        account_ids:
                          type: array
                          items:
                            type: string
                          description: Array of associated account IDs.
                        contact_ids:
                          type: array
                          items:
                            type: string
                          description: Array of associated contact IDs.
                        opportunity_ids:
                          type: array
                          items:
                            type: string
                          description: Array of associated opportunity IDs.
                        calendar_event_ids:
                          type: array
                          items:
                            type: string
                          description: Array of associated calendar event IDs.
                        conversation_ids:
                          type: array
                          items:
                            type: string
                          description: Array of associated conversation IDs.
                        is_org_chart_note:
                          type: boolean
                          description: Whether this note is an org chart note.
                          example: false
                        crm_notes:
                          type: array
                          description: Array of associated CRM note records.
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Missing required filter:
                  value:
                    error: At least one argument is required
                Invalid sort direction:
                  value:
                    error: sort_direction must be "asc" or "desc"
                Invalid sort field:
                  value:
                    error: 'sort_by_field must be one of: created_at, updated_at'
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: At least one argument is required
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
      deprecated: false
