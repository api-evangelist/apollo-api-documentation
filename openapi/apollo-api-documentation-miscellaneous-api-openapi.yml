  /labels/add_entity_ids_to_label_names:
    post:
      summary: Add Records to a List
      description: '## Endpoint essentials


        **API key access:** `api/v1/labels/add_entity_ids_to_label_names` or `Master API key`


        **OAuth scopes:** `lists_add_entities`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        A <a href="https://knowledge.apollo.io/hc/en-us/articles/4409728608525-Create-and-Use-a-List" target="_blank">list</a>
        is a saved group of contacts or accounts in Apollo that you can organize, action, and track together.<br><br>Use the
        Add Records to a List endpoint to add existing contacts or accounts to one or more lists, referencing the lists by
        name. If a list name you provide doesn''t exist yet for the given modality, Apollo creates it automatically.<br><br>Provide
        the record IDs in `entity_ids` and the target list names in `label_names`. To find record IDs, use the <a href="https://docs.apollo.io/reference/search-for-contacts">Search
        for Contacts</a> or <a href="https://docs.apollo.io/reference/search-for-accounts">Search for Accounts</a> endpoints.<br><br>If
        you provide no valid `entity_ids` or no `label_names`, the endpoint makes no changes and returns a `200` response
        with a confirmation message.'
      tags:
      - Miscellaneous
      operationId: add-records-to-a-list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entity_ids
              - label_names
              - modality
              properties:
                entity_ids:
                  type: array
                  items:
                    type: string
                  description: 'The Apollo IDs of the contacts or accounts to add to the lists. IDs that aren''t valid are
                    ignored.<br><br>Example: `["66e34b81740c50074e3d1bd4"]`'
                label_names:
                  type: array
                  items:
                    type: string
                  description: 'The names of the lists to add the records to. If a name doesn''t already exist for the given
                    `modality`, Apollo creates a new list with that name.<br><br>Example: `["Conference 2024 - Maui"]`'
                modality:
                  type: string
                  enum:
                  - contacts
                  - accounts
                  description: The type of records referenced by `entity_ids`. Must be `contacts` or `accounts`.
                async:
                  type: boolean
                  description: 'Controls whether the request is processed synchronously or in the background. <ul><li>`false`
                    (default): Apollo processes the request during the API call and returns the updated lists. A synchronous
                    request must finish within the API''s 5-minute (300-second) request timeout, so a large `entity_ids` batch
                    can time out.</li><li>`true`: Apollo processes the work in the background and immediately returns an `entity_progress_job`
                    object — instead of the updated lists — that you can poll for progress. Use this for batches large enough
                    to risk the 5-minute timeout.</li></ul>'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        modality:
                          type: string
                        cached_count:
                          type: integer
                        name:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        user_id:
                          type: string
                        book_of_business:
                          type: boolean
                          nullable: true
                  message:
                    type: string
                  entity_progress_job:
                    type: object
                    description: Returned instead of `labels` when `async` is `true`. Represents the background job processing
                      the request; poll it to track progress.
                    properties:
                      id:
                        type: string
                      user_id:
                        type: string
                        nullable: true
                      job_type:
                        type: string
                      entity_ids:
                        type: array
                        items:
                          type: string
                      params:
                        type: object
                      progress:
                        type: number
                        description: '`-1` before processing starts, a fraction while in progress, and `1` when complete.'
                      batch_size:
                        type: integer
                        nullable: true
              examples:
                Records added:
                  value:
                    labels:
                    - id: 6612a4b7c8d9e0f123456789
                      modality: contacts
                      cached_count: 2
                      name: Conference 2024 - Maui
                      created_at: '2024-09-17T20:09:57.863Z'
                      updated_at: '2024-09-17T20:09:57.863Z'
                      user_id: 66302798d03b9601c7934ebf
                      book_of_business: null
                Nothing to change:
                  value:
                    message: No Models or Lists provided
                Processing in background (async):
                  value:
                    entity_progress_job:
                      id: 6a1f2c9e4b7d8f0012345678
                      user_id: 66302798d03b9601c7934ebf
                      job_type: add_entities_to_labels
                      entity_ids:
                      - 66e34b81740c50074e3d1bd4
                      params:
                        modality: contacts
                        label_names:
                        - Conference 2024 - Maui
                      progress: -1
                      batch_size: null
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Missing or invalid API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Key lacks required scope:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/labels/add_entity_ids_to_label_names.\
                    \ Request an API key from your administrator that includes this endpoint in its configured scope.\",\n\
                    \  \"error_code\": \"API_INACCESSIBLE\"\n}"
                No access to lists:
                  value: "{\n  \"error\": \"You do not have permission to access lists. Contact your admin to get access to\
                    \ Contacts & Accounts.\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_code:
                    type: string
        '422':
