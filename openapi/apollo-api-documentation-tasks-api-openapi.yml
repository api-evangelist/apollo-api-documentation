  /tasks/{id}:
    get:
      summary: Get a Task
      description: '## Endpoint essentials


        **API key access:** `api/v1/tasks/show` or `Master API key`


        **OAuth scopes:** `tasks_list`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/28705458602125-Tasks-Overview" target="_blank">Tasks</a> let
        you track, prioritize, and help you complete actions required for your outbound sales motion.<br><br>Use the Get a
        Task endpoint to retrieve the full details for a single task that belongs to your team''s Apollo account.<br><br>The
        response includes the task''s associated <a href="https://docs.apollo.io/reference/view-an-account">account</a> and
        <a href="https://docs.apollo.io/reference/view-a-contact">contact</a> when the task has one attached. Depending on
        the task''s `type` and how it was created, the response can also include additional fields, such as `phone_call` for
        call tasks, `emailer_message` for email tasks, or a LinkedIn message template for LinkedIn-step tasks.<br><br>To find
        task IDs, use the <a href="https://docs.apollo.io/reference/search-tasks">Search for Tasks endpoint</a> and identify
        the `id` value for the task you want to view.<br><br>To create a task, use the <a href="https://docs.apollo.io/reference/create-a-task">Create
        a Task endpoint</a> instead.'
      tags:
      - Tasks
      operationId: get-a-task
      parameters:
      - name: id
        in: path
        description: 'The Apollo ID for the task. <br><br>To find task IDs, call the <a href="https://docs.apollo.io/reference/search-tasks">Search
          for Tasks endpoint</a> and identify the `id` value for the task. <br><br>Example: `67a1b2c3d4e5f60001234567`'
