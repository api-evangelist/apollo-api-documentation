  /tasks/{id}/complete:
    post:
      summary: Complete a Task
      description: '## Endpoint essentials


        **API key access:** `api/v1/tasks/complete` or `Master API key`


        **OAuth scopes:** `tasks_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/28705458602125-Tasks-Overview" target="_blank">Tasks</a> let
        you track, prioritize, and help you complete actions required for your outbound sales motion.<br><br>Use the Complete
        a Task endpoint to mark an existing task as `completed`.<br><br>To find task IDs, use the <a href="https://docs.apollo.io/reference/search-tasks">Search
        for Tasks endpoint</a> and identify the `id` value for the task you want to complete.<br><br>If the task no longer
        exists (for example, because the sequence it belonged to was paused and the task was removed), Apollo still returns
        a `200` response, with `deleted: true` on the task, instead of an error.<br><br>To skip a task instead of completing
        it, use the <a href="https://docs.apollo.io/reference/skip-a-task">Skip a Task endpoint</a>.<br><br>Calling this endpoint
        on a task that''s already `completed` or `skipped` returns a `422` response.'
      tags:
      - Tasks
      operationId: complete-a-task
      parameters:
      - name: id
        in: path
        description: 'The Apollo ID for the task. <br><br>To find task IDs, call the <a href="https://docs.apollo.io/reference/search-tasks">Search
          for Tasks endpoint</a> and identify the `id` value for the task. <br><br>Example: `67a1b2c3d4e5f60001234567`'
        schema:
