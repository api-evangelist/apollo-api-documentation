  /tasks/{id}/skip:
    post:
      summary: Skip a Task
      description: '## Endpoint essentials


        **API key access:** `api/v1/tasks/skip` or `Master API key`


        **OAuth scopes:** `tasks_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/28705458602125-Tasks-Overview" target="_blank">Tasks</a> let
        you track, prioritize, and help you complete actions required for your outbound sales motion.<br><br>Use the Skip
        a Task endpoint to mark an existing task as `skipped` without completing it.<br><br>To find task IDs, use the <a href="https://docs.apollo.io/reference/search-tasks">Search
        for Tasks endpoint</a> and identify the `id` value for the task you want to skip.<br><br>If the task no longer exists
        (for example, because the sequence it belonged to was paused and the task was removed), Apollo still returns a `200`
        response, with `deleted: true` on the task, instead of an error.<br><br>Calling this endpoint on a task that''s already
        `completed` or `skipped` returns a `422` response.<br><br>To mark a task as done instead of skipping it, use the <a
        href="https://docs.apollo.io/reference/complete-a-task">Complete a Task endpoint</a>.'
      tags:
      - Tasks
      operationId: skip-a-task
      parameters:
      - name: id
        in: path
        description: 'The Apollo ID for the task. <br><br>To find task IDs, call the <a href="https://docs.apollo.io/reference/search-tasks">Search
          for Tasks endpoint</a> and identify the `id` value for the task. <br><br>Example: `67a1b2c3d4e5f60001234567`'
        schema:
          type: string
        required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: 'An optional note to record when skipping the task. <br><br>Example: `No longer a good fit,
                    moving to a different sequence.`'
                on_task_page:
                  type: boolean
                  description: Whether to reindex the task synchronously so the change is immediately reflected in search
                    results. <br><br>Defaults to `false` (indexed asynchronously).
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 67a1b2c3d4e5f60001234567
                      status:
                        type: string
                        example: skipped
                      note: {}
                      completed:
                        type: boolean
                        example: false
              examples:
                OK:
                  value:
                    task:
                      id: 67a1b2c3d4e5f60001234567
                      status: skipped
                      note: null
                      completed: false
                Task no longer exists:
                  value:
                    task:
                      id: 67a1b2c3d4e5f60001234567
                      deleted: true
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Check API key:
                  value: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
        '403':
          description: '403'
          content:
            application/json:
              examples:
                Key lacks required scope:
                  value: "{\n  \"error\": \"This API key is not authorized to access api/v1/tasks/skip. Request an API key\
                    \ from your administrator that includes this endpoint in its configured scope.\",\n  \"error_code\": \"\
                    API_INACCESSIBLE\"\n}"
                Task functions disabled for this account:
                  value: "{\n  \"error\": \"You do not have permissions to access task functions.\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This API key is not authorized to access api/v1/tasks/skip. Request an API key from your administrator
                      that includes this endpoint in its configured scope.
                  error_code:
                    type: string
                    example: API_INACCESSIBLE
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Belongs to another user:
                  value: "{\n  \"error\": \"This task belongs to another user. Your admin has disabled non-admins from skipping\
                    \ other people's tasks.\"\n}"
                Already completed or skipped:
                  value: "{\n  \"error\": \"This task is already completed / skipped.\",\n  \"allow_moving_to_next_task\"\
                    : true\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: '429'
          content:
            application/json:
              examples:
                Too many requests:
                  value: "{\n  \"message\": \"The maximum number of api calls allowed for api/v1/tasks/skip is 200 times per\
                    \ minute. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The maximum number of api calls allowed for api/v1/tasks/skip is 200 times per minute. Please
                      upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
