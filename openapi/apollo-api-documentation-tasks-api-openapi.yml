    patch:
      summary: Update a Task
      description: '## Endpoint essentials


        **API key access:** `api/v1/tasks/update` or `Master API key`


        **OAuth scopes:** `tasks_create`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/28705458602125-Tasks-Overview" target="_blank">Tasks</a> let
        you track, prioritize, and help you complete actions required for your outbound sales motion.<br><br>Use the Update
        a Task endpoint to change the details of an existing task that belongs to your team''s Apollo account.<br><br>To find
        task IDs, use the <a href="https://docs.apollo.io/reference/search-tasks">Search for Tasks endpoint</a> and identify
        the `id` value for the task you want to update.<br><br>The fields you can update depend on the task''s current `status`.
        For a task with a `scheduled` status, you can update any of the parameters listed below. For a task that''s already
        `completed` or `skipped`, you can only update `note`, `priority`, `priority_cd`, and `contact_id`.<br><br>To mark
        a task as done, use the <a href="https://docs.apollo.io/reference/complete-a-task">Complete a Task</a> or <a href="https://docs.apollo.io/reference/skip-a-task">Skip
        a Task</a> endpoints instead of setting `status` here.


        > ⚠️ Omitting `priority` or `creator_id` resets them

        >

        > If the task you''re updating has a `scheduled` status, and your request doesn''t include a `priority` or `creator_id`
        parameter, Apollo resets `priority` to `medium` and `creator_id` to the user associated with your API key — even if
        you didn''t intend to change those fields. To avoid this, always include the task''s current `priority` and `creator_id`
        in every update request, even when you''re only changing an unrelated field like `note`.'
      tags:
      - Tasks
      operationId: update-a-task
      parameters:
      - name: id
        in: path
        description: 'The Apollo ID for the task. <br><br>To find task IDs, call the <a href="https://docs.apollo.io/reference/search-tasks">Search
          for Tasks endpoint</a> and identify the `id` value for the task. <br><br>Example: `67a1b2c3d4e5f60001234567`'
        schema:
          type: string
        required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: 'The ID for the task owner within your team''s Apollo account. Only applies to tasks with a
                    `scheduled` status. <br><br>Example: `66302798d03b9601c7934ebf`'
                creator_id:
                  type: string
                  description: 'The ID of the user considered the creator of this task. Only applies to tasks with a `scheduled`
                    status. <br><br>If this task currently has a `scheduled` status and you omit this parameter, Apollo resets
                    it to the user associated with your API key. <br><br>Example: `60affe7d6e270a00f5db6fe4`'
                contact_id:
                  type: string
                  description: 'The Apollo ID for the contact you want on the receiving end of the action. <br><br>Example:
                    `66e34b81740c50074e3d1bd4`'
                note:
                  type: string
                  description: 'A description for the task. This should be a human-readable message. <br><br>Example: `This
                    contact expressed interest in the Sequences feature specifically. Be prepared to discuss.`'
                type:
                  type: string
                  description: 'Only applies to tasks with a `scheduled` status. Set the task to 1 of the following task types:
                    <ul> <li> `call`: Call the contact. </li> <li> `outreach_manual_email`: Email the contact. </li> <li>
                    `linkedin_step_connect`: Send a LinkedIn invitation to connect with the contact. </li> <li> `linkedin_step_message`:
                    Send a direct message to the contact''s LinkedIn profile. </li> <li> `linkedin_step_view_profile`: View
                    the contact''s LinkedIn profile. </li> <li> `linkedin_step_interact_post`: Interact with the contact''s
                    recent LinkedIn posts. </li> <li> `action_item`: Take generic action for the contact. </li> </ul>'
                priority:
                  type: string
                  description: 'Assign a priority to the task: `high`, `medium`, or `low`. <br><br>If this task currently
                    has a `scheduled` status and you omit this parameter, Apollo resets its priority to `medium`.'
                  default: medium
                priority_cd:
                  description: Numeric-coded alternative to `priority`. Only applies to tasks that are not `scheduled` (already
                    `completed` or `skipped`).
                status:
                  type: string
                  description: 'Only applies to tasks with a `scheduled` status. To mark a task done, use the <a href="https://docs.apollo.io/reference/complete-a-task">Complete
                    a Task</a> or <a href="https://docs.apollo.io/reference/skip-a-task">Skip a Task</a> endpoints instead
                    of setting this directly. <br><br>Example: `scheduled`'
                due_at:
                  type: string
                  format: date-time
                  description: 'Only applies to tasks with a `scheduled` status. The full date and time when the task is due,
                    in <a href="https://www.rfc-editor.org/rfc/rfc3339#section-5.6" target="_blank">ISO 8601</a> format. <br><br>Example:
                    `2025-02-15T08:10:30Z`'
                title:
                  type: string
                  description: 'Only applies to tasks with a `scheduled` status. A title for the task. <br><br>Example: `Follow
                    up on demo request`'
                call_script:
                  type: string
                  description: Only applies to tasks with a `scheduled` status. A call script or talking points for a `call`
                    type task.
                relevant_fields:
                  type: array
                  description: Only applies to tasks with a `scheduled` status. Names of team-defined relevant fields to surface
                    for this task.
