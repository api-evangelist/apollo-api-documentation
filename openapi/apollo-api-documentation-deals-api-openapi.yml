        **OAuth scopes:** `opportunities_list`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4415062467725-Deals-Overview" target="_blank">Deals</a> on
        Apollo help you track sales opportunities.<br><br>Use the List All Deals endpoint to retrieve every deal that has
        been created for your team''s Apollo account.'
      tags:
      - Deals
      operationId: list-all-deals
      parameters:
      - name: sort_by_field
        in: query
        description: 'Sort the tasks by 1 of the following options:    <ul> <li> `amount`: The largest deal values first.
          </li> <li> `is_closed`: Deals that have been closed first. </li> <li> `is_won`: Deals that have been won first.
          </li> </ul>'
        schema:
          type: string
      - name: page
        in: query
        description: 'The page number of the Apollo data that you want to retrieve. <br><br>Use this parameter in combination
          with the `per_page` parameter to make search results for navigable and improve the performance of the endpoint.
          <br><br>Example: `4`'
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        description: 'The number of search results that should be returned for each page. Limiting the number of results per
          page improves the endpoint''s performance. <br><br>Use the `page` parameter to search the different pages of data.
          <br><br>Example: `10`'
