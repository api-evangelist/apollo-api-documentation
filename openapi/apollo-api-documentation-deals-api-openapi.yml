    patch:
      summary: Update Deal
      description: '## Endpoint essentials


        **API key access:** `deals/api/v1/opportunities/update` or `Master API key`


        **OAuth scopes:** `opportunity_update`


        **Credit usage:** `0 credits` — [Learn more about API pricing and credits](https://docs.apollo.io/docs/api-pricing).


        <a href="https://knowledge.apollo.io/hc/en-us/articles/4415062467725-Deals-Overview" target="_blank">Deals</a> on
        Apollo help you track sales opportunities.<br><br>Use the Update Deal endpoint to update the details of existing deals
        within your team''s Apollo account.<br><br>To create new deals in your Apollo account, use the <a href="https://docs.apollo.io/reference/create-deal">Create
        Deal endpoint</a> instead.'
      tags:
      - Deals
      operationId: update-deal
      parameters:
      - name: opportunity_id
        in: path
        description: 'The ID for the deal you want to update. <br><br>Each deal in the Apollo database is assigned a unique
          ID. To find deal IDs, call the <a href="https://docs.apollo.io/reference/list-all-deals" target="_blank">List All
          Deals endpoint</a> and identify the value for `id` for the desired deal. <br><br>Example: `66e09ea8e3cfcf01b2208ec7`'
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_id:
                  type: string
                  description: 'The ID for the deal owner within your team''s Apollo account. Enter a different ID to update
                    the owner of the deal. <br><br>Use the <a href="https://docs.apollo.io/reference/get-a-list-of-users"
                    target="_blank">Get a List of Users endpoint</a> to retrieve IDs for all of the users within your Apollo
                    account. <br><br>Example: `66302798d03b9601c7934ebf`'
                name:
                  type: string
                  description: 'Update the name of the deal. This should be a human-readable name. <br><br>Example: `Massive
                    Q3 Deal`'
                amount:
                  type: string
                  description: 'The monetary value of the deal. Enter a different value to update the deal amount. <br><br>Do
                    not enter commas or currency symbols for the value. The currency is automatically populated by the settings
                    within your Apollo account. Commas are not accepted and result in the deal amount being left blank. <br><br>Example:
                    `55123478` (results in a deal value of `$55,123,478` if the default currency is USD)'
                opportunity_stage_id:
                  type: string
                  description: 'The ID for the deal stage within your team''s Apollo account. Enter a different ID to update
                    the deal stage. <br><br>Each deal stage is assigned a unique ID. To find deal stage IDs, call the <a href="https://docs.apollo.io/reference/list-deal-stages"
                    target="_blank">List Deal Stages endpoint</a> and identify the value for `id` for each stage. <br><br>Example:
                    `6095a710bd01d100a506d4bd`'
                closed_date:
                  type: string
                  format: date
                  description: 'Update the estimated close date for the deal. This can be a future or past date. <br><br>The
                    date should be formatted as `YYYY-MM-DD`. <br><br>Example: `2025-10-30`'
                typed_custom_fields:
                  type: object
                  description: "Add information to <a href=\"https://knowledge.apollo.io/hc/en-us/articles/4415062486669-Create-a-Deal\"\
                    \ target=\"_blank\">custom fields</a> in Apollo. <br><br><b>Your custom fields are unique to your team's\
                    \ Apollo account. This means that the examples in this documentation may not work for your testing purposes.</b>\
                    \ <br><br>To utilize this parameter successfully, call the <a href=\"https://docs.apollo.io/reference/get-a-list-of-all-custom-fields\"\
                    >Get a List of All Custom Fields</a> endpoint and identify the `id` value for the custom field, as well\
                    \ as the appropriate data type. For example, if a custom field accepts picklist entries, you need to pass\
                    \ the accompanying `id` value for the picklist entry that you want to use as the input value. <br><br><b>Example</b>:\
                    \ When the <a href=\"https://docs.apollo.io/reference/get-a-list-of-all-custom-fields\">Get a List of\
                    \ All Custom Fields</a> endpoint returns an `id` of field: \n * `\"60c39ed82bd02f01154c470a\"` (datetime)\
                    \ \n \n\n then the value passed should be: \n\n `{\"60c39ed82bd02f01154c470a\": \"2025-08-07\"}`"
                  additionalProperties:
                    type: string
                  example:
                    60c39ed82bd02f01154c470a: '2025-08-07'
