        '403':
          description: '403'
          content:
            application/json:
              examples:
                Need master API key:
                  value: "{\n  \"error\": \"This API key is not authorized to access deals/api/v1/opportunities/create. Request\
                    \ an API key from your administrator that includes this endpoint in its configured scope.\",\n  \"error_code\"\
                    : \"API_INACCESSIBLE\"\n}"
              schema:
                type: object
