name: Apollo MCP
description: >-
  Apollo ships a first-party hosted remote MCP server that exposes its 240M+ contact database, real-time
  enrichment engine, CRM records, sequences, tasks, conversations and analytics to AI clients. Streamable HTTP
  transport, OAuth 2.0 only — no API key, no local install. Also distributed as a built-in connector on ChatGPT,
  Claude, Perplexity, Replit and Cursor.
status: published
deployment:
  mode: remote
  endpoint: https://mcp.apollo.io/mcp
  auth: oauth
  verified: probed
  transport: streamable-http
  note: >-
    Endpoint published verbatim by Apollo at https://docs.apollo.io/docs/apollo-mcp ("Endpoint |
    https://mcp.apollo.io/mcp | Transport | Streamable HTTP | Authentication | OAuth 2.0 | Local install
    required | No | API key required | No"). Probed 2026-08-14: POST tools/list and POST initialize both
    return HTTP 401 {"error":"Unauthorized: Missing or invalid Authorization header"}, confirming a live
    server that gates the schema behind OAuth. The three /.well-known/ OAuth documents on the same host
    return 200 anonymously and are saved under well-known/.
  no_stdio_package: true
  stdio_note: >-
    Apollo ships NO stdio/npx MCP package. apolloio/apollo-mcp-plugin is a Claude Code + Cowork plugin that
    wires the same remote endpoint; it is not a local server. Every documented client configuration
    (Claude Code, Codex, VS Code Copilot, Claude Desktop, Antigravity) registers the https URL.
