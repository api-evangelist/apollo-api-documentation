constraints:
  - Destructive actions such as bulk delete are not supported.
  - Apollo prohibits AI model training with Apollo MCP integrations; model training must be off in the client.
  - Access is scoped to the authorizing Apollo user's own permissions.
  - >-
    Free Apollo accounts registered with a personal email address cannot use people/company search and
    enrichment actions, retrieve complete records, match contacts, or add people to prospects.
  - Apollo MCP uses separate rate limits from the REST API and does not return the x-rate-limit-* headers.
  - No additional cost to connect; the workspace's plan, permissions and credit balance still apply.
